<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    :root { --bg:#0b0f14; --text:#ffffff; --accent:#3b82f6; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
    }

    #svg { width: 100vw; height: 100vh; display: block; }

    /* Header */
    #header { position: fixed; top: 22px; left: 22px; z-index: 1000; pointer-events: none; }
    #title { font-size: 34px; font-weight: 900; margin: 0; }
    #subtitle { font-size: 14px; opacity: 0.85; margin-top: 6px; }

    /* Toolbar */
    #toolbar { position: fixed; top: 22px; right: 22px; z-index: 1100; display:flex; gap:10px; pointer-events:auto; }
    .tb-btn {
      background: #1f2937;
      border: 2px solid rgba(255,255,255,0.35);
      color: #fff;
      min-width: 46px;
      height: 46px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 900;
      font-size: 20px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .tb-btn.text-btn { font-size: 14px; padding: 0 16px; width:auto; }
    .tb-btn:hover { border-color:#fff; background:#2b3647; }

    /* ====== NODE READABILITY (your key requirement) ====== */
    .markmap-foreign {
      background: #111827 !important;
      border: 2px solid var(--accent) !important;
      border-radius: 12px !important;

      /* Twice the height + readable */
      padding: 18px 26px !important;
      min-height: 60px !important;

      color: #ffffff !important;
      font-weight: 900 !important;
      font-size: 18px !important;
      line-height: 1.15 !important;

      /* allow wrapping for longer labels */
      white-space: normal !important;
      max-width: 360px !important;

      box-shadow: 0 10px 26px rgba(0,0,0,0.65) !important;
      display: flex !important;
      align-items: center !important;
    }
    .markmap-foreign div { color:#fff !important; }

    .markmap-link { stroke: rgba(255,255,255,0.38) !important; stroke-width: 2.8px !important; }
  </style>
</head>

<body>
  <div id="header">
    <div id="title">Taxonomy: Animals, Food, and Catering</div>
    <div id="subtitle">Expand level: 2 (click a node to magnify)</div>
  </div>

  <div id="toolbar">
    <button class="tb-btn" id="zin">+</button>
    <button class="tb-btn" id="zout">−</button>
    <button class="tb-btn text-btn" id="reset">Resize</button>
    <button class="tb-btn text-btn" id="close">Close</button>
  </div>

  <svg id="svg" class="markmap"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function(){
      const { Transformer, Markmap } = window.markmap;

      const svgEl = document.getElementById('svg');
      const svgSel = d3.select(svgEl);
      const transformer = new Transformer();

      let mm = null;
      let zoom = null;
      let gEl = null;
      let homeTransform = null;

      function setupCustomZoom() {
        gEl = svgEl.querySelector('g');
        if (!gEl) return;

        // Remove any existing zoom handlers so ours is authoritative
        svgSel.on('.zoom', null);

        zoom = d3.zoom()
          .scaleExtent([0.2, 6])
          .on('zoom', (event) => {
            d3.select(gEl).attr('transform', event.transform);
          });

        svgSel.call(zoom);
      }

      function computeFitTransform() {
        if (!gEl || !zoom) return null;

        const bbox = gEl.getBBox();
        const w = svgEl.clientWidth || window.innerWidth;
        const h = svgEl.clientHeight || window.innerHeight;
        const pad = 90;

        const scale = Math.min(
          w / (bbox.width + pad * 2),
          h / (bbox.height + pad * 2)
        );

        const tx = (w - bbox.width * scale) / 2 - bbox.x * scale;
        const ty = (h - bbox.height * scale) / 2 - bbox.y * scale;

        return d3.zoomIdentity.translate(tx, ty).scale(scale);
      }

      function goHome(animated = true) {
        if (!zoom) return;
        if (!homeTransform) homeTransform = computeFitTransform();
        if (!homeTransform) return;

        const t = svgSel.transition().duration(animated ? 260 : 0);
        t.call(zoom.transform, homeTransform);
      }

      function zoomBy(factor) {
        if (!zoom) return;
        svgSel.transition().duration(180).call(zoom.scaleBy, factor);
      }

      function focusNode(nodeG) {
        if (!zoom || !nodeG) return;

        const bbox = nodeG.getBBox();
        const w = svgEl.clientWidth || window.innerWidth;
        const h = svgEl.clientHeight || window.innerHeight;

        const current = d3.zoomTransform(svgEl);
        const targetK = Math.min(5, Math.max(current.k * 1.8, 1.6));

        const cx = bbox.x + bbox.width / 2;
        const cy = bbox.y + bbox.height / 2;

        const t = d3.zoomIdentity
          .translate(w / 2 - cx * targetK, h / 2 - cy * targetK)
          .scale(targetK);

        svgSel.transition().duration(260).call(zoom.transform, t);
      }

      function bindUI() {
        const stop = (e) => { e.preventDefault(); e.stopPropagation(); };

        document.getElementById('zin').addEventListener('click', (e) => { stop(e); zoomBy(1.25); }, true);
        document.getElementById('zout').addEventListener('click', (e) => { stop(e); zoomBy(0.8); }, true);
        document.getElementById('reset').addEventListener('click', (e) => { stop(e); goHome(true); }, true);
        document.getElementById('close').addEventListener('click', (e) => {
          stop(e);
          window.parent.postMessage({ type: 'VAT_CLOSE' }, '*');
        }, true);

        // Click-to-magnify (your requirement #2)
        svgEl.addEventListener('click', (e) => {
          // ignore toolbar clicks
          if (e.target.closest('#toolbar')) return;

          const node = e.target.closest('g.markmap-node');
          if (!node) return;

          focusNode(node);
        }, true);

        // Keep home view accurate on resize
        window.addEventListener('resize', () => {
          // recompute home view after layout changes
          if (gEl && zoom) {
            homeTransform = computeFitTransform();
          }
        });
      }

      // Receive markdown from Squarespace
      window.addEventListener('message', (ev) => {
        if (!ev || !ev.data || ev.data.type !== 'VAT_SET') return;

        const md = String(ev.data.markdown || '');
        const { root } = transformer.transform(md);

        if (!mm) {
          mm = Markmap.create(svgEl, {
            autoFit: false,          // we control fit ourselves
            spacingVertical: 120,    // MORE vertical => “steeper” like your LLM example
            spacingHorizontal: 95    // LESS horizontal => reduces “wide” sprawl
          }, root);

          // after first render, attach our zoom + set home view
          setTimeout(() => {
            setupCustomZoom();
            homeTransform = computeFitTransform();
            goHome(false);
            bindUI();
          }, 0);

        } else {
          mm.setData(root);
          setTimeout(() => {
            homeTransform = computeFitTransform();
            goHome(true);
          }, 0);
        }
      });

      // Handshake
      window.parent.postMessage({ type: 'VAT_READY' }, '*');
    })();
  </script>
</body>
</html>
