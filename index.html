<style>
  /* Launch Button */
  #vat-mm-open {
    display: inline-flex;
    align-items: center;
    border: 2px solid #fff;
    border-radius: 8px;
    padding: 12px 24px;
    font-weight: 800;
    cursor: pointer;
    background: #000;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Fullscreen overlay - SOLID BLACK to hide ghost elements */
  #vat-mm-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 2147483647 !important; /* Maximum possible Z-index */
    background: #0b0f14; 
    display: none;
  }
  #vat-mm-overlay.vat-open { display: block; }

  #vat-mm-iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>

<button id="vat-mm-open" type="button">Launch Interactive Mindmap</button>

<div id="vat-mm-overlay">
  <iframe id="vat-mm-iframe" title="VAT Mindmap"></iframe>
</div>

<script>
(function(){
  const VIEWER_URL = "https://peterlewis-create.github.io/vat-mindmap-viewer/";
  const overlay = document.getElementById('vat-mm-overlay');
  const iframe = document.getElementById('vat-mm-iframe');

  const VAT_MINDMAP_MD = `# VAT on Animals, Food, and Catering (UK)
## Food & Drink (Human consumption)
### Live Animals
#### Zero rated
#### Standard Rated
### Food for Human consumption
#### General-Zero Rated
#### Excepted Items (Standard Rated)
#### Specialised Food
### Catering and takeaway
#### Catering per se (Standard-Rated)
#### Hot Takeaway Food
## Animal Feed
### Animal Feed
#### General Feed (Zero-Rated)
#### Pet and Bird Food
### Plants and Seeds
#### Zero-Rated
#### Standard-Rated
### Services and Processes
#### New Zero-rated good production
#### Abattoir slaughtering only (Standard-Rated)
#### Dressing carcasses (Zero-rated)
#### Livery services (Standard-rated)`;

  function sendData() {
    if (iframe.contentWindow) {
      iframe.contentWindow.postMessage({ 
        type: 'VAT_SET', 
        markdown: VAT_MINDMAP_MD 
      }, '*');
    }
  }

  document.getElementById('vat-mm-open').onclick = () => {
    overlay.classList.add('vat-open');
    document.body.style.overflow = 'hidden';
    iframe.src = VIEWER_URL + "?v=" + Date.now();
    iframe.onload = () => setTimeout(sendData, 400);
  };

  window.addEventListener('message', (ev) => {
    if (ev.data.type === 'VAT_READY') sendData();
    if (ev.data.type === 'VAT_CLOSE') {
      overlay.classList.remove('vat-open');
      document.body.style.overflow = '';
      iframe.src = 'about:blank';
    }
  });

  // ESC key listener
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      overlay.classList.remove('vat-open');
      document.body.style.overflow = '';
      iframe.src = 'about:blank';
    }
  });
})();
</script>
