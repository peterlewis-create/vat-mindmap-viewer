<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    :root{
      --bg: #0b1220;
      --panel: rgba(7,12,22,.92);
      --panel2: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.10);
      --text: #e5e7eb;
      --muted: rgba(229,231,235,.70);
      --danger: #ef4444;
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow: hidden;
    }

    .topbar{
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255,255,255,.08);
      z-index: 10;
    }

    .title{
      font-weight: 650;
      letter-spacing: .2px;
      opacity: .95;
      white-space: nowrap;
    }

    .pill{
      font-size: 12px;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
      max-width: 42vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spacer{ flex: 1; }

    .btn{
      appearance: none;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      user-select: none;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }

    .stage{
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
    }

    svg#mindmap{
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(1200px 800px at 30% 20%, rgba(255,255,255,.06), transparent 60%),
                  radial-gradient(900px 600px at 70% 70%, rgba(255,255,255,.05), transparent 55%),
                  var(--bg);
    }

    /* Make dense maps more readable */
    .markmap-node text{ font-size: 13px; }
    .markmap-node circle{ r: 5; }

    .panel{
      position: fixed;
      top: 60px;
      right: 12px;
      width: min(520px, calc(100vw - 24px));
      max-height: calc(100vh - 72px);
      background: rgba(7,12,22,.96);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 12px;
      z-index: 20;
      display: none;
      overflow: auto;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    .panel h3{
      margin: 0 0 10px 0;
      font-size: 14px;
      letter-spacing: .2px;
      opacity: .95;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel .close{
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .src{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .src .t{ font-weight: 650; font-size: 13px; margin-bottom: 4px; }
    .src .m{ color: var(--muted); font-size: 12px; line-height: 1.35; }
    .src a{ color: #93c5fd; text-decoration: none; }
    .src a:hover{ text-decoration: underline; }

    textarea{
      width: 100%;
      min-height: 240px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.4;
      outline: none;
    }

    .row{
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .error{
      display: none;
      position: fixed;
      left: 12px;
      bottom: 12px;
      right: 12px;
      max-width: 980px;
      background: rgba(127,29,29,.95);
      border: 1px solid rgba(255,255,255,.20);
      color: #fee2e2;
      padding: 10px 12px;
      border-radius: 12px;
      z-index: 30;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      font-size: 13px;
    }
  </style>

  <!-- Libraries (CDN is fine on GitHub Pages) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17.0/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.0/dist/browser/index.min.js"></script>
</head>

<body>
  <div class="topbar">
    <div class="title">VAT Mindmap</div>
    <div id="status" class="pill">Waiting for content…</div>
    <div class="spacer"></div>
    <button class="btn" id="btnFit">Fit</button>
    <button class="btn" id="btnSources">Sources</button>
    <button class="btn" id="btnPaste">Paste</button>
    <button class="btn" id="btnClear">Clear</button>
  </div>

  <div class="stage">
    <svg id="mindmap"></svg>
  </div>

  <div class="panel" id="sourcesPanel">
    <h3>
      Verified Sources
      <button class="close" id="closeSources">Close</button>
    </h3>
    <div id="sourcesList"></div>
  </div>

  <div class="panel" id="pastePanel">
    <h3>
      Paste mindmap markdown
      <button class="close" id="closePaste">Close</button>
    </h3>
    <textarea id="pasteText" placeholder="# VAT&#10;- Animal feed&#10;  - Pet food exceptions&#10;  - Working animals"></textarea>
    <div class="row">
      <button class="btn" id="btnRender">Render</button>
    </div>
  </div>

  <div class="error" id="errorBox"></div>

  <script>
    (function(){
      const LS_KEY_MD = "vat_mindmap_last_md";
      const LS_KEY_SOURCES = "vat_mindmap_last_sources";

      const statusEl = document.getElementById("status");
      const errorBox = document.getElementById("errorBox");

      const sourcesPanel = document.getElementById("sourcesPanel");
      const sourcesList = document.getElementById("sourcesList");

      const pastePanel = document.getElementById("pastePanel");
      const pasteText = document.getElementById("pasteText");

      function setStatus(text){ statusEl.textContent = text; }
      function showError(msg){
        errorBox.textContent = msg;
        errorBox.style.display = "block";
        setTimeout(() => { errorBox.style.display = "none"; }, 9000);
      }

      function dedupeSources(arr){
        const seen = new Set();
        const out = [];
        for (const s of (Array.isArray(arr) ? arr : [])){
          const doc_id = (s && (s.doc_id || s.docId || s.id)) ? String(s.doc_id || s.docId || s.id) : "";
          const title = (s && s.title) ? String(s.title) : "";
          const url = (s && (s.source_url || s.url)) ? String(s.source_url || s.url) : "";
          const key = (doc_id + "|" + title + "|" + url).trim().toLowerCase();
          if (!key || seen.has(key)) continue;
          seen.add(key);
          out.push({ doc_id, title, url });
        }
        return out;
      }

      function renderSources(list){
        const src = dedupeSources(list);
        sourcesList.innerHTML = "";
        if (!src.length){
          sourcesList.innerHTML = "<div class='src'><div class='t'>No sources provided</div><div class='m'>When you send sources from Squarespace/n8n, they will appear here.</div></div>";
          return;
        }
        for (const s of src){
          const div = document.createElement("div");
          div.className = "src";
          const title = s.title || "(untitled source)";
          const meta = [
            s.doc_id ? `doc_id: ${s.doc_id}` : "",
            s.url ? `<a href="${s.url}" target="_blank" rel="noopener noreferrer">open source</a>` : ""
          ].filter(Boolean).join(" · ");
          div.innerHTML = `<div class="t">${escapeHtml(title)}</div><div class="m">${meta || ""}</div>`;
          sourcesList.appendChild(div);
        }
      }

      function escapeHtml(str){
        return String(str).replace(/[&<>"']/g, (m) => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
        }[m]));
      }

      // Markmap init
      const { Markmap, Transformer } = window.markmap || {};
      if (!Markmap || !Transformer){
        showError("Markmap libraries did not load. Check your browser console and CDN access.");
        setStatus("Library load failed");
        return;
      }
      const transformer = new Transformer();

      const svg = document.getElementById("mindmap");
      const mm = Markmap.create(svg, { duration: 180 });

      function setMindmap(md, sources, originLabel){
        const markdown = String(md || "").trim();
        if (!markdown){
          setStatus("Waiting for content…");
          mm.setData({ content: "VAT", children: [] });
          mm.fit();
          renderSources([]);
          return;
        }

        try{
          const { root } = transformer.transform(markdown);
          mm.setData(root);
          mm.fit();

          const src = dedupeSources(sources);
          renderSources(src);

          localStorage.setItem(LS_KEY_MD, markdown);
          localStorage.setItem(LS_KEY_SOURCES, JSON.stringify(src));

          setStatus(originLabel || "Loaded");
        }catch(e){
          showError("Could not render mindmap. Make sure the markdown is valid.\n\n" + (e && e.message ? e.message : String(e)));
          setStatus("Render error");
        }
      }

      // Buttons
      document.getElementById("btnFit").addEventListener("click", () => mm.fit());
      document.getElementById("btnSources").addEventListener("click", () => { sourcesPanel.style.display = "block"; });
      document.getElementById("closeSources").addEventListener("click", () => { sourcesPanel.style.display = "none"; });

      document.getElementById("btnPaste").addEventListener("click", () => {
        pastePanel.style.display = "block";
        const last = localStorage.getItem(LS_KEY_MD) || "";
        if (!pasteText.value.trim()) pasteText.value = last.trim();
      });
      document.getElementById("closePaste").addEventListener("click", () => { pastePanel.style.display = "none"; });
      document.getElementById("btnRender").addEventListener("click", () => {
        pastePanel.style.display = "none";
        setMindmap(pasteText.value, safeJson(localStorage.getItem(LS_KEY_SOURCES)), "Loaded (manual paste)");
      });

      document.getElementById("btnClear").addEventListener("click", () => {
        localStorage.removeItem(LS_KEY_MD);
        localStorage.removeItem(LS_KEY_SOURCES);
        setMindmap("", [], "Cleared");
      });

      function safeJson(s){
        try{ return JSON.parse(s || "[]"); }catch(_){ return []; }
      }

      // Listen for Squarespace -> iframe postMessage
      window.addEventListener("message", (event) => {
        const d = event && event.data ? event.data : null;
        if (!d || typeof d !== "object") return;

        // Accept these message types
        if (d.type === "vat-mindmap" || d.type === "vat_mindmap"){
          setMindmap(d.markdown, d.sources, "Loaded (embedded)");
          if (d.openSources === true) sourcesPanel.style.display = "block";
          return;
        }
        if (d.type === "vat-fit"){ mm.fit(); return; }
        if (d.type === "vat-clear"){ document.getElementById("btnClear").click(); return; }
      });

      // Load last saved content (so opening the page directly shows something)
      const lastMd = (localStorage.getItem(LS_KEY_MD) || "").trim();
      const lastSources = safeJson(localStorage.getItem(LS_KEY_SOURCES));
      if (lastMd){
        setMindmap(lastMd, lastSources, "Loaded (last saved)");
      }else{
        // A simple placeholder so you can immediately see it works
        const demo =
`# VAT
## Animal feed
### Pet food exceptions
### Working animals
## Food & drink
### Catering rules
### Takeaway vs eat-in`;
        setMindmap(demo, [], "Loaded (demo)");
      }

      // Responsive fit
      window.addEventListener("resize", () => {
        try{ mm.fit(); }catch(_){}
      });

    })();
  </script>
</body>
</html>
