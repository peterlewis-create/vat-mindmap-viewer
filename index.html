<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    :root { color-scheme: dark; }
    html, body {
      height: 100%;
      margin: 0;
      background: #12161c;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: rgba(255,255,255,.88);
    }

    header {
      position: fixed;
      inset: 0 0 auto 0;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: rgba(18,22,28,.95);
      border-bottom: 1px solid rgba(255,255,255,.08);
      z-index: 10;
      user-select: none;
    }
    .title { font-weight: 650; letter-spacing: .2px; }
    .crumbs { display: flex; gap: 6px; align-items: center; overflow: hidden; }
    .crumbs button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.9);
      border-radius: 12px;
      padding: 6px 10px;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .crumbs .sep { opacity: .55; padding: 0 2px; }
    .hint { margin-left: auto; font-size: 12px; opacity: .72; white-space: nowrap; }

    main { position: fixed; inset: 52px 0 0 0; background: #12161c; }
    svg#mindmap { width: 100%; height: 100%; display: block; }

    /* Node box styling (Markmap uses foreignObject with a DIV inside) */
    svg#mindmap foreignObject > div {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 7px 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
      font-size: 13px;
      line-height: 1.2;
    }

    .mm-chevron { opacity: .65; margin-left: 8px; }

    .rate {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
    }
    .rate.zero { background: rgba(34,197,94,.20); border-color: rgba(34,197,94,.35); }
    .rate.standard { background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.35); }
    .rate.reduced { background: rgba(245,158,11,.18); border-color: rgba(245,158,11,.35); }
    .rate.exempt { background: rgba(148,163,184,.18); border-color: rgba(148,163,184,.35); }
    .rate.depends { background: rgba(59,130,246,.18); border-color: rgba(59,130,246,.35); }
  </style>
</head>

<body>
  <header>
    <div class="title" id="hdrTitle">VAT Mindmap</div>
    <div class="crumbs" id="crumbs"></div>
    <div class="hint">Click to drill in. Click same node again to step back. Esc = Home.</div>
  </header>

  <main>
    <svg id="mindmap"></svg>
  </main>

  <!-- Known-good browser builds -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js"></script>

  <script>
    (function () {
      const api = window.markmap;
      const svgEl = document.getElementById('mindmap');
      const crumbsEl = document.getElementById('crumbs');
      const titleEl = document.getElementById('hdrTitle');

      const MAX_DEPTH = 6;

      let transformer = null;
      let mm = null;

      let baseRoot = null;        // immutable reference tree
      const idMap = new Map();    // id -> base node
      let selectedId = "0";       // current drill position

      function stripHtml(html) {
        return String(html || "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
      }

      function pruneToDepth(node, maxDepth, depth = 1) {
        if (!node || !Array.isArray(node.children)) return;
        if (depth >= maxDepth) { node.children = []; return; }
        node.children.forEach(ch => pruneToDepth(ch, maxDepth, depth + 1));
      }

      function indexTree(node, id = "0") {
        node.__id = id;
        node.__baseContent = node.content; // keep original label (no chevrons/badges)
        node.__allChildren = Array.isArray(node.children) ? node.children : [];
        idMap.set(id, node);
        node.__allChildren.forEach((ch, i) => indexTree(ch, id + "." + i));
      }

      function isOnRoute(nodeId, selId) {
        return selId === nodeId || selId.startsWith(nodeId + ".");
      }

      function decorateContent(node) {
        const raw = String(node.__baseContent || "");
        const txt = stripHtml(raw).toLowerCase();

        // VAT badge if this node is a VAT rate leaf
        if (txt.startsWith("vat rate:")) {
          let cls = "depends";
          if (txt.includes("zero")) cls = "zero";
          else if (txt.includes("standard")) cls = "standard";
          else if (txt.includes("reduced")) cls = "reduced";
          else if (txt.includes("exempt")) cls = "exempt";

          const label = stripHtml(raw);
          return `<span class="rate ${cls}">${label}</span>`;
        }

        // Chevron for nodes that can expand
        const hasKids = (node.__allChildren || []).length > 0;
        return raw + (hasKids ? ` <span class="mm-chevron">›</span>` : "");
      }

      function buildDisplayTree(node) {
        const out = { ...node };
        out.content = decorateContent(node);

        if (isOnRoute(node.__id, selectedId)) {
          out.children = (node.__allChildren || []).map(buildDisplayTree);
        } else {
          out.children = [];
        }
        return out;
      }

      function pathIds(selId) {
        const parts = selId.split(".");
        const ids = [];
        for (let i = 0; i < parts.length; i++) ids.push(parts.slice(0, i + 1).join("."));
        return ids;
      }

      function renderBreadcrumbs() {
        crumbsEl.innerHTML = "";
        const ids = pathIds(selectedId);

        ids.forEach((id, idx) => {
          const n = idMap.get(id);
          if (!n) return;

          const label = stripHtml(n.__baseContent);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = label || "…";
          btn.title = label || "";
          btn.addEventListener("click", () => { selectedId = id; render(); });
          crumbsEl.appendChild(btn);

          if (idx < ids.length - 1) {
            const sep = document.createElement("span");
            sep.className = "sep";
            sep.textContent = "›";
            crumbsEl.appendChild(sep);
          }
        });
      }

      function maybePromise(x) {
        return (x && typeof x.then === "function") ? x : Promise.resolve(x);
      }

      function getNodeFromEvent(e) {
        let el = e.target;
        while (el && !el.__data__) el = el.parentNode;
        const d = el && el.__data__;
        if (d && typeof d === "object" && typeof d.__id === "string") return d;
        return null;
      }

      async function render() {
        if (!baseRoot) return;

        renderBreadcrumbs();
        const displayRoot = buildDisplayTree(baseRoot);

        if (!mm) {
          mm = api.Markmap.create(svgEl, {
            initialExpandLevel: 99, // we collapse by removing children, not toggles
            zoom: true,
            pan: true,
            autoFit: false
          }, displayRoot);
        } else {
          await maybePromise(mm.setData(displayRoot, { initialExpandLevel: 99 }));
        }

        await maybePromise(mm.fit());
      }

      async function loadMarkdown(markdown) {
        const md = String(markdown || "").trim();
        if (!md) return;

        // Safety: detect missing Markmap libs
        if (!api || !api.Markmap || !api.Transformer) {
          titleEl.textContent = "VAT Mindmap (ERROR)";
          crumbsEl.innerHTML = "";
          console.error("Markmap libraries missing. window.markmap =", window.markmap);
          return;
        }

        transformer = transformer || new api.Transformer();

        const { root } = transformer.transform(md);
        pruneToDepth(root, MAX_DEPTH, 1);

        baseRoot = root;
        idMap.clear();
        indexTree(baseRoot, "0");

        titleEl.textContent = stripHtml(baseRoot.__baseContent) || "VAT Mindmap";
        selectedId = "0";

        await render();
      }

      // Click: drill in / step back
      svgEl.addEventListener("click", async (e) => {
        const node = getNodeFromEvent(e);
        if (!node) return;

        e.preventDefault();
        e.stopPropagation();

        if (node.__id === selectedId) {
          const parts = selectedId.split(".");
          selectedId = (parts.length > 1) ? parts.slice(0, -1).join(".") : "0";
        } else {
          selectedId = node.__id;
        }

        await render();
      }, true);

      // Esc: home
      document.addEventListener("keydown", async (e) => {
        if (e.key === "Escape" && baseRoot) {
          selectedId = "0";
          await render();
        }
      });

      // postMessage from Squarespace
      window.addEventListener("message", async (event) => {
        const data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.type === "VAT_MINDMAP_MD") {
          await loadMarkdown(data.markdown || "");
        } else if (data.type === "FIT" && mm) {
          await maybePromise(mm.fit());
        }
      });

      // Placeholder so you always see *something*
      loadMarkdown("# VAT Mindmap\n## Waiting for markdown…\n");
    })();
  </script>
</body>
</html>
