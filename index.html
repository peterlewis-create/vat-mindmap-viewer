<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #070b14;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    #wrap { position: fixed; inset: 0; }
    svg { width: 100%; height: 100%; display: block; }

    /* Background rectangle that markmap draws */
    rect.markmap-bg { fill: #070b14; }

    /* Text styling inside nodes */
    :root { --vat-font-scale: 1; }
    .markmap-foreign { color: #eaf2ff; }
    .markmap-foreign > div {
      font-size: calc(16px * var(--vat-font-scale));
      line-height: 1.25;
      background: rgba(8, 14, 28, 0.78);
      border: 1px solid rgba(120, 170, 255, 0.85);
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(3px);
    }
    .markmap-foreign a { color: #b9d4ff; text-decoration: none; }
    .markmap-foreign a:hover { text-decoration: underline; }

    /* Status pill */
    #status {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 10;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.92);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      user-select: none;
    }
    #status b { font-weight: 700; }
  </style>

  <!-- Markmap CDN (pinned versions for stability) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12"></script>
</head>
<body>
  <div id="wrap">
    <svg id="mm"></svg>
  </div>
  <div id="status"><b>Viewer:</b> booting…</div>

  <script>
    (function () {
      const CHANNEL = "vat-mindmap";
      const statusEl = document.getElementById("status");
      const svg = document.getElementById("mm");

      const { Transformer } = window.markmap;
      const { Markmap, loadCSS, loadJS } = window.markmap;

      const transformer = new Transformer();
      let mm = null;

      let currentMd = "";
      let currentExpandLevel = 2;

      function setStatus(text) {
        statusEl.innerHTML = text;
      }

      async function render(md, expandLevel) {
        currentMd = String(md || "");
        currentExpandLevel = Number.isFinite(expandLevel) ? expandLevel : currentExpandLevel;

        const safeMd = currentMd.trim();
        if (!safeMd) {
          setStatus("<b>Viewer:</b> waiting for markdown…");
          if (mm) {
            try { await mm.setData(null); } catch (e) {}
          }
          return;
        }

        setStatus("<b>Viewer:</b> rendering…");

        const { root, features } = transformer.transform(safeMd);
        const assets = transformer.getAssets(features);

        if (assets.styles) loadCSS(assets.styles);
        if (assets.scripts) {
          await loadJS(assets.scripts, { getMarkmap: () => window.markmap });
        }

        if (!mm) {
          mm = Markmap.create(svg, {
            initialExpandLevel: currentExpandLevel,
            zoom: true,
            pan: true,
            duration: 200
          }, root);
        } else {
          await mm.setData(root, { initialExpandLevel: currentExpandLevel });
        }

        await mm.fit();
        setStatus("<b>Viewer:</b> ready");
      }

      // postMessage handler
      window.addEventListener("message", async (evt) => {
        const msg = evt && evt.data;
        if (!msg || typeof msg !== "object") return;
        if (msg.channel !== CHANNEL) return;

        try {
          if (msg.type === "setMarkdown") {
            await render(msg.markdown || "", Number(msg.expandLevel ?? currentExpandLevel));
            evt.source && evt.source.postMessage({ channel: CHANNEL, type: "rendered" }, "*");
          } else if (msg.type === "setExpandLevel") {
            currentExpandLevel = Number(msg.expandLevel ?? currentExpandLevel);
            if (currentMd.trim()) await render(currentMd, currentExpandLevel);
            evt.source && evt.source.postMessage({ channel: CHANNEL, type: "expanded", expandLevel: currentExpandLevel }, "*");
          } else if (msg.type === "fit") {
            if (mm) await mm.fit();
          } else if (msg.type === "setFontScale") {
            const s = Number(msg.scale);
            document.documentElement.style.setProperty("--vat-font-scale", String(Math.min(1.6, Math.max(0.85, s || 1))));
          }
        } catch (err) {
          setStatus("<b>Viewer:</b> error (open console)");
          evt.source && evt.source.postMessage({ channel: CHANNEL, type: "error", message: String(err && err.message || err) }, "*");
        }
      });

      // handshake
      try {
        window.parent && window.parent.postMessage({ channel: CHANNEL, type: "ready" }, "*");
        setStatus("<b>Viewer:</b> waiting for markdown…");
      } catch (e) {
        setStatus("<b>Viewer:</b> ready");
      }

      // Optional: render something if opened directly without parent
      if (location.hash && location.hash.startsWith("#md=")) {
        try {
          const md = decodeURIComponent(location.hash.slice(4));
          render(md, currentExpandLevel);
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
