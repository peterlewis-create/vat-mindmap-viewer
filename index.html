<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#0a1a2c;
      --panel:rgba(7,12,22,.92);
      --panel2:rgba(255,255,255,.06);
      --text:#e5e7eb;
      --muted:rgba(229,231,235,.75);
      --border:rgba(255,255,255,.10);
      --accent:rgba(255,255,255,.12);
    }
    html, body { height:100%; margin:0; }
    body{
      background: radial-gradient(1200px 700px at 20% 10%, var(--bg2), var(--bg1));
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden;
    }

    .topbar{
      position:fixed; top:0; left:0; right:0;
      height:52px;
      display:flex; align-items:center; gap:10px;
      padding:0 12px;
      background:var(--panel);
      border-bottom:1px solid var(--panel2);
      z-index:10;
    }
    .title{ font-weight:650; letter-spacing:.2px; opacity:.95; }
    .pill{
      font-size:12px;
      padding:4px 8px;
      border:1px solid var(--border);
      border-radius:999px;
      color:var(--muted);
      background:rgba(255,255,255,.04);
      white-space:nowrap;
    }
    .spacer{ flex:1; }

    .btn{
      appearance:none;
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:7px 10px;
      border-radius:10px;
      cursor:pointer;
      font-size:13px;
    }
    .btn:hover{ background:rgba(255,255,255,.10); }
    .btn:active{ transform:translateY(1px); }

    .stage{
      position:absolute;
      top:52px; left:0; right:0; bottom:0;
    }
    /* embed=1 gives true full-screen */
    body.embed .stage{ top:0; }
    body.embed .topbar{ display:none; }

    svg{
      width:100%;
      height:100%;
      display:block;
      /* helps deep trees readability a bit */
      font-size:14px;
    }

    .side{
      position:fixed;
      top:52px; bottom:0; left:0;
      width:340px;
      transform:translateX(-102%);
      transition:transform .2s ease;
      background:rgba(7,12,22,.94);
      border-right:1px solid var(--panel2);
      z-index:9;
      padding:12px;
      overflow:auto;
    }
    body.embed .side{ top:0; }
    .side.open{ transform:translateX(0); }
    .side h3{
      margin:4px 0 10px 0;
      font-size:14px;
      letter-spacing:.2px;
      opacity:.9;
    }
    .source{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      border-radius:12px;
      padding:10px;
      margin:0 0 10px 0;
      font-size:13px;
      line-height:1.35;
    }
    .source b{ display:block; margin-bottom:3px; }

    .modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:20;
    }
    .modal.open{ display:flex; }
    .card{
      width:min(900px, calc(100vw - 28px));
      height:min(560px, calc(100vh - 28px));
      background:rgba(10,18,32,.96);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .cardhead{
      display:flex; align-items:center; gap:10px;
      padding:12px 12px;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .cardhead .hint{ color:var(--muted); font-size:12px; }
    textarea{
      flex:1;
      width:100%;
      resize:none;
      border:0;
      outline:none;
      padding:12px;
      background:transparent;
      color:var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:12px;
      line-height:1.5;
    }
    .cardfoot{
      display:flex; gap:10px; justify-content:flex-end;
      padding:12px;
      border-top:1px solid rgba(255,255,255,.10);
    }

    .centerNotice{
      position:absolute;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:min(920px, calc(100vw - 28px));
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255шин,.12);
      border-radius:18px;
      padding:14px 16px;
      color:var(--muted);
      z-index:5;
      display:none;
    }
    .centerNotice b{ color:var(--text); }
    .centerNotice code{
      display:block;
      margin-top:8px;
      padding:10px;
      border-radius:12px;
      background:rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.10);
      color:var(--text);
      overflow:auto;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:12px;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="title">VAT Mindmap</div>
    <div id="status" class="pill">Loading libraries…</div>
    <div class="spacer"></div>
    <button class="btn" id="fitBtn">Fit</button>
    <button class="btn" id="srcBtn">Sources</button>
    <button class="btn" id="pasteBtn">Paste</button>
    <button class="btn" id="clearBtn">Clear</button>
  </div>

  <div id="side" class="side">
    <h3>Verified sources</h3>
    <div id="sourcesList"></div>
  </div>

  <div class="stage">
    <svg id="mm"></svg>
    <div id="notice" class="centerNotice"></div>
  </div>

  <div id="modal" class="modal">
    <div class="card">
      <div class="cardhead">
        <div style="font-weight:650;">Paste mindmap markdown</div>
        <div class="hint">This is only for testing. Your Squarespace page will send the markdown automatically.</div>
        <div class="spacer"></div>
        <button class="btn" id="modalCloseTop">Close</button>
      </div>
      <textarea id="mdInput" spellcheck="false"></textarea>
      <div class="cardfoot">
        <button class="btn" id="modalClose">Cancel</button>
        <button class="btn" id="modalApply">Apply</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const isEmbed = qs.get('embed') === '1';
      if (isEmbed) document.body.classList.add('embed');

      const statusEl = document.getElementById('status');
      const sideEl = document.getElementById('side');
      const sourcesListEl = document.getElementById('sourcesList');
      const noticeEl = document.getElementById('notice');

      const fitBtn = document.getElementById('fitBtn');
      const srcBtn = document.getElementById('srcBtn');
      const pasteBtn = document.getElementById('pasteBtn');
      const clearBtn = document.getElementById('clearBtn');

      const modal = document.getElementById('modal');
      const mdInput = document.getElementById('mdInput');
      const modalClose = document.getElementById('modalClose');
      const modalCloseTop = document.getElementById('modalCloseTop');
      const modalApply = document.getElementById('modalApply');

      let mm = null;               // Markmap instance
      let lastMarkdown = '';
      let lastSources = [];

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.style.borderColor = isError ? 'rgba(255,120,120,.55)' : 'rgba(255,255,255,.10)';
        statusEl.style.color = isError ? 'rgba(255,200,200,.95)' : 'rgba(229,231,235,.75)';
        statusEl.style.background = isError ? 'rgba(255,80,80,.08)' : 'rgba(255,255,255,.04)';
      }

      function showNotice(title, body) {
        noticeEl.style.display = 'block';
        noticeEl.innerHTML = '<b>' + escapeHtml(title) + '</b>' + (body ? '<code>' + escapeHtml(body) + '</code>' : '');
      }
      function hideNotice() {
        noticeEl.style.display = 'none';
        noticeEl.innerHTML = '';
      }

      function escapeHtml(s) {
        return String(s ?? '')
          .replaceAll('&','&amp;')
          .replaceAll('<','&lt;')
          .replaceAll('>','&gt;');
      }

      function uniqSources(arr) {
        const out = [];
        const seen = new Set();
        (Array.isArray(arr) ? arr : []).forEach((s) => {
          const doc_id = String(s?.doc_id ?? '');
          const title = String(s?.title ?? s?.name ?? '');
          const chunk = String(s?.chunk_index ?? s?.chunk ?? '');
          const url = String(s?.source_url ?? s?.url ?? '');
          const key = [doc_id, title, chunk, url].join('|').toLowerCase();
          if (key.trim() && !seen.has(key)) { seen.add(key); out.push({ doc_id, title, chunk, url }); }
        });
        return out;
      }

      function renderSources(arr) {
        const items = uniqSources(arr);
        sourcesListEl.innerHTML = '';
        if (!items.length) {
          sourcesListEl.innerHTML = '<div style="color:rgba(229,231,235,.75);font-size:13px;">No sources supplied.</div>';
          return;
        }
        items.forEach((s) => {
          const div = document.createElement('div');
          div.className = 'source';
          const label = (s.doc_id || s.title || 'Source').trim();
          const sub = [
            s.title && s.title !== label ? s.title : '',
            s.chunk ? ('Chunk ' + s.chunk) : ''
          ].filter(Boolean).join(' • ');
          const link = s.url ? ('<a href="' + s.url + '" target="_blank" rel="noopener" style="color:rgba(180,210,255,.95);text-decoration:none;">Open</a>') : '';
          div.innerHTML =
            '<b>' + escapeHtml(label) + '</b>' +
            (sub ? ('<div style="color:rgba(229,231,235,.75);margin-top:2px;">' + escapeHtml(sub) + '</div>') : '') +
            (link ? ('<div style="margin-top:6px;">' + link + '</div>') : '');
          sourcesListEl.appendChild(div);
        });
      }

      // Load external scripts in order, trying a list of URLs for each.
      function loadScriptAny(urls) {
        return new Promise((resolve, reject) => {
          const list = Array.isArray(urls) ? urls.slice() : [];
          const tried = [];
          function next() {
            if (!list.length) return reject(new Error('All URLs failed:\n' + tried.join('\n')));
            const url = list.shift();
            tried.push(url);

            const s = document.createElement('script');
            s.src = url;
            s.async = true;
            s.onload = () => resolve({ url, tried });
            s.onerror = () => {
              s.remove();
              next();
            };
            document.head.appendChild(s);
          }
          next();
        });
      }

      async function loadLibraries() {
        setStatus('Loading libraries…');
        hideNotice();

        // Recommended (per Markmap docs): jsDelivr package URLs. :contentReference[oaicite:1]{index=1}
        // We also keep unpkg as a fallback, but avoid fragile dist paths.
        try {
          await loadScriptAny([
            'https://cdn.jsdelivr.net/npm/d3@7',
            'https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js',
            'https://unpkg.com/d3@7'
          ]);
        } catch (e) {
          setStatus('D3 load failed', true);
          showNotice('Library load failed', String(e?.message || e));
          throw e;
        }

        try {
          await loadScriptAny([
            'https://cdn.jsdelivr.net/npm/markmap-lib@0.17.0',
            'https://cdn.jsdelivr.net/npm/markmap-lib',
            'https://unpkg.com/markmap-lib@0.17.0',
            'https://unpkg.com/markmap-lib'
          ]);
        } catch (e) {
          setStatus('Markmap-lib load failed', true);
          showNotice('Library load failed', String(e?.message || e));
          throw e;
        }

        try {
          await loadScriptAny([
            'https://cdn.jsdelivr.net/npm/markmap-view@0.17.0',
            'https://cdn.jsdelivr.net/npm/markmap-view',
            'https://unpkg.com/markmap-view@0.17.0',
            'https://unpkg.com/markmap-view'
          ]);
        } catch (e) {
          setStatus('Markmap-view load failed', true);
          showNotice('Library load failed', String(e?.message || e));
          throw e;
        }

        if (!window.markmap || !window.markmap.Transformer || !window.markmap.Markmap) {
          const msg = 'Markmap loaded, but window.markmap API is missing. This usually means a blocked/partial CDN response.';
          setStatus('Markmap API missing', true);
          showNotice('Library load failed', msg);
          throw new Error(msg);
        }

        setStatus('Waiting for content…');
      }

      function buildMap(markdown) {
        const svg = document.getElementById('mm');
        svg.innerHTML = '';

        const transformer = new window.markmap.Transformer();
        const { root } = transformer.transform(markdown || '# VAT\n\n- Waiting for content');

        // deriveOptions exists in many builds; if not, Markmap still works with defaults.
        const deriveOptions = window.markmap.deriveOptions;
        const options = deriveOptions ? deriveOptions({}) : {};

        mm = window.markmap.Markmap.create(svg, options, root);

        // Small delay helps first-fit on some browsers
        setTimeout(() => { try { mm.fit(); } catch(e){} }, 80);
      }

      function setContent(markdown, sources) {
        lastMarkdown = String(markdown || '').trim();
        lastSources = Array.isArray(sources) ? sources : [];
        renderSources(lastSources);

        if (!lastMarkdown) {
          mm = null;
          document.getElementById('mm').innerHTML = '';
          setStatus('Waiting for content…');
          return;
        }

        setStatus('Rendering…');
        hideNotice();
        buildMap(lastMarkdown);
        setStatus('Ready');
      }

      // UI
      fitBtn.addEventListener('click', () => { try { mm && mm.fit(); } catch(e){} });
      srcBtn.addEventListener('click', () => sideEl.classList.toggle('open'));
      clearBtn.addEventListener('click', () => setContent('', []));

      pasteBtn.addEventListener('click', () => {
        mdInput.value = lastMarkdown || DEFAULT_MD;
        modal.classList.add('open');
        mdInput.focus();
      });
      function closeModal(){ modal.classList.remove('open'); }
      modalClose.addEventListener('click', closeModal);
      modalCloseTop.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
      modalApply.addEventListener('click', () => {
        setContent(mdInput.value, lastSources);
        closeModal();
      });

      // Default markdown for testing (so you can immediately see “something”).
      const DEFAULT_MD = `# VAT

## Animal feed
- Pet food exceptions
- Working animals

## Food & drink
- Catering rules
- Takeaway vs eat-in
`;

      // PostMessage API (for Squarespace / parent pages)
      // Expected:
      //   { type: 'vat_mindmap', markdown: '...', sources: [...] }
      // Optional:
      //   { type: 'vat_mindmap_cmd', cmd: 'fit' | 'clear' | 'sources_open' | 'sources_close' }
      window.addEventListener('message', (ev) => {
        const data = ev?.data || {};
        if (data.type === 'vat_mindmap') {
          setContent(data.markdown || '', data.sources || []);
          if (data.fit) { try { mm && mm.fit(); } catch(e){} }
        }
        if (data.type === 'vat_mindmap_cmd') {
          const cmd = String(data.cmd || '');
          if (cmd === 'fit') { try { mm && mm.fit(); } catch(e){} }
          if (cmd === 'clear') setContent('', []);
          if (cmd === 'sources_open') sideEl.classList.add('open');
          if (cmd === 'sources_close') sideEl.classList.remove('open');
        }
      });

      // Boot
      loadLibraries()
        .then(() => {
          // If someone visits the page directly, show a tiny default so they know it works.
          // If you prefer it truly blank, delete the next line.
          setContent(DEFAULT_MD, []);
        })
        .catch(() => {
          // Notice already shown
        });

    })();
  </script>
</body>
</html>
