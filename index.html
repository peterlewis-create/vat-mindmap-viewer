<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    :root { color-scheme: dark; }
    html, body {
      height: 100%;
      margin: 0;
      background: #12161c;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: rgba(255,255,255,.88);
    }

    header {
      position: fixed;
      inset: 0 0 auto 0;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: rgba(18,22,28,.95);
      border-bottom: 1px solid rgba(255,255,255,.08);
      z-index: 10;
      user-select: none;
    }
    .title { font-weight: 650; letter-spacing: .2px; }
    .crumbs { display: flex; gap: 6px; align-items: center; overflow: hidden; }
    .crumbs button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.9);
      border-radius: 12px;
      padding: 6px 10px;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .crumbs .sep { opacity: .55; padding: 0 2px; }
    .hint { margin-left: auto; font-size: 12px; opacity: .72; white-space: nowrap; }

    main { position: fixed; inset: 52px 0 0 0; background: #12161c; }
    svg#mindmap { width: 100%; height: 100%; display: block; }

    /* Node box styling (Markmap uses foreignObject with a DIV inside) */
    svg#mindmap foreignObject > div {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 7px 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
      font-size: 13px;
      line-height: 1.2;
    }

    .mm-chevron { opacity: .65; margin-left: 8px; }

    .rate {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
    }
    .rate.zero { background: rgba(34,197,94,.20); border-color: rgba(34,197,94,.35); }
    .rate.standard { background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.35); }
    .rate.reduced { background: rgba(245,158,11,.18); border-color: rgba(245,158,11,.35); }
    .rate.exempt { background: rgba(148,163,184,.18); border-color: rgba(148,163,184,.35); }
    .rate.depends { background: rgba(59,130,246,.18); border-color: rgba(59,130,246,.35); }
  </style>
</head>

<body>
  <header>
    <div class="title" id="hdrTitle">VAT Mindmap</div>
    <div class="crumbs" id="crumbs"></div>
    <div class="hint">Click to drill in. Click same node again to step back. Esc = Home.</div>
  </header>

  <main>
    <svg id="mindmap"></svg>
  </main>

  <!-- Known-good browser builds -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js"></script>
