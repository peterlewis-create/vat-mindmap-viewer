<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>
  <style>
    :root {
      --bg: #0b0f14;
      --text: #ffffff;
    }
    html, body { 
      height: 100%; margin: 0; background: var(--bg); 
      overflow: hidden; font-family: sans-serif; color: var(--text); 
    }
    #svg { width: 100vw; height: 100vh; display: block; }

    /* Header & Toolbars - Fixed Z-Index to stay on top */
    #header { position: fixed; top: 25px; left: 25px; z-index: 999; pointer-events: none; }
    #title { font-size: 28px; font-weight: 800; margin: 0; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    #subtitle { font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 5px; }
    
    #toolbar { position: fixed; top: 25px; right: 25px; z-index: 1000; display: flex; gap: 10px; pointer-events: auto; }
    .tb-btn { 
      background: #1f2937; /* Solid color for visibility */
      border: 2px solid rgba(255,255,255,0.4); 
      color: white; 
      min-width: 44px; height: 44px; border-radius: 8px; 
      cursor: pointer; font-weight: 800; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .tb-btn.text-btn { font-size: 14px; padding: 0 15px; width: auto; }
    .tb-btn:hover { background: #374151; border-color: #fff; }

    /* BOX READABILITY FIX */
    .markmap-foreign {
      background: #111827 !important; /* High contrast dark background */
      border: 2px solid #3b82f6 !important; /* Bright blue border for clarity */
      border-radius: 8px !important;
      padding: 12px 20px !important; /* Much larger boxes */
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 16px !important; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      white-space: nowrap; /* Prevents text bunching */
    }
    .markmap-foreign div { color: #ffffff !important; }
    
    .markmap-link { stroke: rgba(255,255,255,0.4) !important; stroke-width: 2.5px !important; }
  </style>
</head>
<body>
  <div id="header">
    <div id="title">Taxonomy: Animals, Food, and Catering</div>
    <div id="subtitle">Based on 179 sources</div>
  </div>
  <div id="toolbar">
    <button class="tb-btn" id="zin">+</button>
    <button class="tb-btn" id="zout">−</button>
    <button class="tb-btn text-btn" id="reset">Resize</button>
    <button class="tb-btn text-btn" id="close">Close</button>
  </div>
  <svg id="svg" class="markmap"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function () {
      const { Transformer, Markmap } = window.markmap;
      const svg = document.querySelector('#svg');
      let mm = null;
      const transformer = new Transformer();

      window.addEventListener('message', (ev) => {
        if (ev.data.type !== 'VAT_SET') return;
        const { root } = transformer.transform(ev.data.markdown || '');
        if (!mm) {
          mm = Markmap.create(svg, {
            autoFit: true,
            spacingVertical: 60,   /* Adds significant height between lines */
            spacingHorizontal: 160,
          }, root);
        } else {
          mm.setData(root);
          mm.fit();
        }
      });

      // STOP PROPAGATION ensures clicks don't close the overlay
      document.getElementById('zin').onclick = (e) => { e.stopPropagation(); mm.rescale(1.3); };
      document.getElementById('zout').onclick = (e) => { e.stopPropagation(); mm.rescale(0.7); };
      document.getElementById('reset').onclick = (e) => { e.stopPropagation(); mm.fit(); };
      document.getElementById('close').onclick = (e) => { 
        e.stopPropagation(); 
        window.parent.postMessage({type:'VAT_CLOSE'}, '*'); 
      };

      window.parent.postMessage({ type: 'VAT_READY' }, '*');
    })();
  </script>
</body>
</html>
