<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f172a;
      --text:#ffffff;
      --muted:#94a3b8;
      --accent:#3b82f6;
      --nodeBg:#111827;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
    }
    #svg{
      width:100vw;
      height:100vh;
      display:block;
      background:var(--bg);
    }

    /* Header */
    #header{
      position:fixed;
      top:22px;
      left:22px;
      z-index:10;
      pointer-events:none;
      text-shadow:0 2px 18px rgba(0,0,0,.75);
    }
    #title{
      font-size:34px;
      font-weight:900;
      margin:0;
      line-height:1.05;
    }
    #subtitle{
      margin-top:6px;
      font-size:14px;
      color:rgba(255,255,255,.78);
      font-weight:600;
    }

    /* Toolbar */
    #toolbar{
      position:fixed;
      top:22px;
      right:22px;
      z-index:20;
      display:flex;
      gap:10px;
      pointer-events:auto;
    }
    .tb-btn{
      background:#1f2937;
      border:2px solid rgba(255,255,255,.35);
      color:#fff;
      height:44px;
      min-width:44px;
      border-radius:10px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(0,0,0,.45);
    }
    .tb-btn.text{
      padding:0 14px;
      min-width:auto;
      font-size:14px;
      font-weight:900;
    }
    .tb-btn:hover{
      border-color:#fff;
      background:#273449;
    }

    /* Status (bottom-left) */
    #status{
      position:fixed;
      left:18px;
      bottom:18px;
      z-index:30;
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.16);
      padding:8px 10px;
      border-radius:10px;
      color:rgba(255,255,255,.85);
      font-size:12px;
      font-weight:700;
      max-width:60vw;
      pointer-events:none;
      backdrop-filter: blur(6px);
    }

    /* Make node boxes BIG + readable */
    .markmap-foreign{
      background:var(--nodeBg) !important;
      border:2px solid var(--accent) !important;
      border-radius:12px !important;
      padding:14px 20px !important;
      color:#fff !important;
      font-weight:900 !important;
      font-size:18px !important;
      line-height:1.25 !important;

      /* Bigger height (at least double your old look) */
      min-height:58px !important;

      /* Allow wrapping for long labels */
      white-space:normal !important;
      max-width:360px !important;
      word-break:break-word !important;

      box-shadow:0 14px 26px rgba(0,0,0,.55) !important;
    }
    .markmap-foreign div{ color:#fff !important; }

    .markmap-link{
      stroke:rgba(255,255,255,.35) !important;
      stroke-width:2.5px !important;
    }
  </style>
</head>

<body>
  <div id="header">
    <div id="title">Taxonomy: Animals, Food, and Catering</div>
    <div id="subtitle">Expand level: <span id="lvl">2</span> (click a node to magnify)</div>
  </div>

  <div id="toolbar">
    <button class="tb-btn" id="levelUp" title="Expand one more level">+</button>
    <button class="tb-btn" id="levelDown" title="Collapse one level">−</button>
    <button class="tb-btn text" id="reset" title="Back to level 2 and fit">Resize</button>
    <button class="tb-btn text" id="close" title="Close">Close</button>
  </div>

  <div id="status">Waiting for mindmap data…</div>

  <svg id="svg" class="markmap"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function () {
      const statusEl = document.getElementById('status');
      const lvlEl = document.getElementById('lvl');

      const svg = document.querySelector('#svg');
      const { Transformer, Markmap } = window.markmap;

      const transformer = new Transformer();
      let mm = null;

      let expandLevel = 2;
      let currentMarkdown = '';
      let baseRoot = null;

      function setStatus(msg){ statusEl.textContent = msg; }
      function setLevelUI(){ lvlEl.textContent = String(expandLevel); }

      function clone(obj){
        return obj ? JSON.parse(JSON.stringify(obj)) : obj;
      }

      function buildRoot(md){
        const out = transformer.transform(md || '');
        return out && out.root ? out.root : null;
      }

      function renderFromBaseRoot(){
        if (!baseRoot) return;

        const root = clone(baseRoot);

        const opts = {
          autoFit: true,

          // KEY: opening screen only shows 2 levels
          initialExpandLevel: expandLevel,

          // Make it “steeper / more readable” like your LLM example:
          spacingVertical: 110,    // more vertical separation
          spacingHorizontal: 120,  // narrower level-1→2 gap
          paddingX: 18,

          // enforce bigger node boxes
          nodeMinHeight: 58,

          // keep click behaviour consistent
          toggleRecursively: false,
        };

        if (!mm) {
          mm = Markmap.create(svg, opts, root);
        } else {
          // setData supports an options override
          mm.setData(root, opts);
          mm.fit();
        }

        // Bind click-to-magnify on nodes AFTER render
        bindNodeMagnify();
        setLevelUI();
      }

      function bindNodeMagnify(){
        if (!mm || !mm.g) return;

        // Markmap uses g.markmap-node for node groups
        mm.g.selectAll('g.markmap-node')
          .on('click.vat', async (event, d) => {
            try{
              event.preventDefault();
              event.stopPropagation();

              // Expand/collapse that node (keeps “expand as selected” behaviour)
              if (d && d.children && d.children.length) {
                await mm.toggleNode(d);
              }

              // Magnify: reset to a known baseline, then zoom into the clicked node
              // (This makes other areas move out of view, as you requested.)
              mm.fit();
              await mm.centerNode(d, { top: 120, right: 120, bottom: 120, left: 120 });
              await mm.rescale(1.75); // strong magnification

              await mm.setHighlight(d);
              setStatus('Magnified selected branch. Use Resize to return to the full level-2 view.');
            } catch (e){
              setStatus('Viewer error: ' + (e && e.message ? e.message : String(e)));
            }
          });
      }

      function resetToLevel2(){
        expandLevel = 2;
        setLevelUI();
        renderFromBaseRoot();
        if (mm) mm.fit();
        setStatus('Reset to expand level 2.');
      }

      // Toolbar
      document.getElementById('levelUp').addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        expandLevel = Math.min(8, expandLevel + 1);
        renderFromBaseRoot();
        if (mm) mm.fit();
        setStatus('Expand level set to ' + expandLevel + '.');
      }, true);

      document.getElementById('levelDown').addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        expandLevel = Math.max(1, expandLevel - 1);
        renderFromBaseRoot();
        if (mm) mm.fit();
        setStatus('Expand level set to ' + expandLevel + '.');
      }, true);

      document.getElementById('reset').addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        resetToLevel2();
      }, true);

      document.getElementById('close').addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        window.parent.postMessage({ type:'VAT_CLOSE' }, '*');
      }, true);

      // Receive markdown from Squarespace
      window.addEventListener('message', (ev) => {
        if (!ev || !ev.data) return;
        if (ev.data.type !== 'VAT_SET') return;

        currentMarkdown = String(ev.data.markdown || '').trim();
        if (!currentMarkdown) {
          setStatus('No markdown received (VAT_SET was empty).');
          return;
        }

        baseRoot = buildRoot(currentMarkdown);
        if (!baseRoot) {
          setStatus('Could not parse markdown into a mindmap.');
          return;
        }

        setStatus('Data received. Rendering…');
        renderFromBaseRoot();
        if (mm) mm.fit();
        setStatus('Ready. Expand level ' + expandLevel + '. Click a node to magnify.');
      });

      // Tell parent we’re ready
      window.parent.postMessage({ type:'VAT_READY' }, '*');

      // If user opens GitHub URL directly, show an instruction instead of blank
      setTimeout(() => {
        if (!baseRoot) {
          setStatus('Waiting for data from the parent page… (open via your Squarespace “Mindmap” button)');
        }
      }, 700);
    })();
  </script>
</body>
</html>
