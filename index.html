<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.16.0/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.16.0/dist/index.min.js"></script>

  <style>
    :root{
      --vat-node-font: 18px;
      --vat-node-bg: rgba(12, 18, 34, 0.92);
      --vat-node-border: rgba(90, 140, 255, 0.95);
      --vat-node-text: #ffffff;
      --vat-link: rgba(170, 190, 255, 0.40);
      --vat-dot: rgba(200, 220, 255, 0.65);
      --vat-bg: #070b14;
    }
    html, body { height:100%; margin:0; background: var(--vat-bg); overflow:hidden; }
    #wrap { position:fixed; inset:0; }
    svg.markmap { width:100%; height:100%; }

    .markmap-foreign, foreignObject > div {
      font: 650 var(--vat-node-font)/1.15 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--vat-node-text) !important;
      background: var(--vat-node-bg);
      border: 1px solid var(--vat-node-border);
      border-radius: 12px;
      padding: 6px 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      max-width: 380px;
      white-space: normal;
    }

    .markmap-link { stroke: var(--vat-link) !important; }
    circle { fill: var(--vat-dot) !important; }

    #status{
      position:fixed; left:12px; bottom:12px;
      color: rgba(255,255,255,.75);
      font: 600 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 10px;
      background: rgba(0,0,0,.25);
      pointer-events:none;
      user-select:none;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <svg id="mm" class="markmap"></svg>
    <div id="status">Ready</div>
  </div>

  <script>
    (function(){
      const statusEl = document.getElementById('status');
      const svg = document.getElementById('mm');

      const transformer = new markmap.Transformer();
      const mm = markmap.Markmap.create(svg, { duration: 200 }, { content: 'VAT Mindmap' });

      let lastMarkdown = '# VAT Mindmap\\n\\n(Waiting for content…)';
      let currentDepth = 2;
      let maxDepth = 2;

      function setStatus(t){ statusEl.textContent = t; }

      function computeMaxDepth(node, d=0){
        if (!node) return d;
        let m = d;
        const kids = node.children || [];
        for (const c of kids) m = Math.max(m, computeMaxDepth(c, d+1));
        return m;
      }

      function applyFoldToDepth(node, d, depth){
        node.payload = node.payload || {};
        if (d >= depth) {
          node.payload.fold = 1;
        } else {
          node.payload.fold = 0;
          const kids = node.children || [];
          for (const c of kids) applyFoldToDepth(c, d+1, depth);
        }
      }

      function render(markdown, depth){
        const md = String(markdown || '').trim() || '# VAT Mindmap\\n\\n(No content)';
        lastMarkdown = md;

        const { root } = transformer.transform(md);
        maxDepth = computeMaxDepth(root, 0);

        const target = Math.max(1, Math.min(Number(depth || currentDepth), maxDepth));
        currentDepth = target;

        applyFoldToDepth(root, 0, target);
        mm.setData(root);
        mm.fit();
        setStatus(`Depth ${currentDepth}/${maxDepth}`);
      }

      function isValidMsg(x){
        return x && typeof x === 'object' && x.channel === 'vat-mindmap';
      }

      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!isValidMsg(msg)) return;

        try{
          if (msg.type === 'setMarkdown') render(msg.markdown, currentDepth);
          if (msg.type === 'collapseTo') render(lastMarkdown, Number(msg.depth || 2));
          if (msg.type === 'fit') mm.fit();
          if (msg.type === 'setFontScale') {
            const scale = Math.max(0.85, Math.min(1.6, Number(msg.scale || 1)));
            const base = 18;
            document.documentElement.style.setProperty('--vat-node-font', (base * scale).toFixed(0) + 'px');
            setStatus(`Text x${scale.toFixed(2)} | Depth ${currentDepth}/${maxDepth}`);
            mm.fit();
          }
        }catch(e){
          setStatus('Error: ' + (e && e.message ? e.message : 'render failed'));
        }
      });

      render(lastMarkdown, currentDepth);

      try{
        window.parent && window.parent.postMessage({ channel:'vat-mindmap', type:'ready' }, '*');
      }catch(_){}
    })();
  </script>
</body>
</html>
