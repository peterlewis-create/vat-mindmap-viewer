<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    html, body { height:100%; margin:0; }
    body{ background:#0b0f16; overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    #mm{ width:100vw; height:100vh; display:block; background:#0b0f16; }
    .markmap-link{ opacity:0.40; }
    foreignObject{ overflow:visible !important; }

    #hdr{ position:fixed; left:18px; top:16px; z-index:30; pointer-events:none; }
    #hdrTitle{ font-size:22px; font-weight:850; color:rgba(255,255,255,.96); margin:0 0 6px 0; }
    #hdrSub{ font-size:13px; font-weight:650; color:rgba(255,255,255,.62); margin:0; }

    #uiBar{
      position:fixed; right:14px; top:14px; z-index:40;
      display:flex; gap:8px; align-items:center;
      padding:10px; border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.32);
      backdrop-filter:blur(8px);
      user-select:none;
    }
    #uiBar button{
      appearance:none;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.92);
      border-radius:12px;
      padding:9px 10px;
      font:850 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      cursor:pointer;
      white-space:nowrap;
    }
    #uiBar button:hover{ background:rgba(255,255,255,.10); }
    #uiBar .sep{ width:1px; height:22px; background:rgba(255,255,255,.14); margin:0 2px; }

    /* Node pills */
    .markmap-foreign{
      display:flex !important; align-items:flex-start; gap:10px;
      box-sizing:border-box !important;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(55,65,81,0.82);
      border:1px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.96) !important;
      font-size:15px; font-weight:800; line-height:1.18;
      text-align:left;
      box-shadow:0 12px 34px rgba(0,0,0,0.28);
      backdrop-filter:blur(7px);
      width:320px; max-width:320px;
      white-space:normal !important;
      overflow-wrap:anywhere; word-break:break-word; hyphens:auto;
      cursor:pointer;
      pointer-events:auto;
    }
    .markmap-foreign *{ color:rgba(255,255,255,0.96) !important; }

    /* Root a bit wider, still wraps */
    .mm-depth-0{
      width:380px !important; max-width:380px !important;
      font-size:16px !important; font-weight:900 !important;
      padding:12px 14px !important;
    }

    .mm-expander{
      display:inline-flex; align-items:center; justify-content:center;
      width:22px; height:22px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(0,0,0,0.20);
      color:rgba(255,255,255,0.90);
      font-weight:950; font-size:14px;
      flex:0 0 auto;
      cursor:pointer;
      user-select:none;
      margin-top:1px;
    }
    .mm-expander.mm-disabled{ opacity:0.30; cursor:default; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view/dist/browser/index.min.js"></script>
</head>

<body>
  <div id="hdr">
    <div id="hdrTitle"></div>
    <div id="hdrSub"></div>
  </div>

  <div id="uiBar">
    <button id="zoomIn" type="button">+</button>
    <button id="zoomOut" type="button">−</button>
    <div class="sep"></div>
    <button id="overview" type="button">Overview</button>
    <button id="readable" type="button">Readable</button>
    <div class="sep"></div>
    <button id="reset" type="button">Reset</button>
    <button id="closeBtn" type="button">Close</button>
  </div>

  <svg id="mm"></svg>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const INIT_LEVEL = Math.max(1, parseInt(params.get("init") || "2", 10)); // show first 2 levels only
      const MAX_LEVEL  = Math.max(INIT_LEVEL, parseInt(params.get("max") || "6", 10));

      const svg = document.getElementById("mm");
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;
      const transformer = new Transformer();

      const hdrTitleEl = document.getElementById("hdrTitle");
      const hdrSubEl   = document.getElementById("hdrSub");

      let mm = null;
      let initialData = null;

      function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

      function decodeHtmlEntities(str){
        const t = document.createElement("textarea");
        t.innerHTML = String(str || "");
        return t.value;
      }

      function setHeaderFrom(titleText){
        hdrTitleEl.textContent = decodeHtmlEntities(titleText || "").trim() || "UK VAT Taxonomy";
        const sources = params.get("sources");
        hdrSubEl.textContent = sources ? ("Based on " + sources + " sources") : "";
      }

      function ensurePayload(n){
        if (!n.payload || typeof n.payload !== "object") n.payload = {};
        return n.payload;
      }

      // Collapsible storage: children <-> payload._children
      function stashChildren(n){
        const p = ensurePayload(n);
        if (n.children && n.children.length){
          if (!p._children || !p._children.length) p._children = n.children;
          n.children = [];
        }
      }
      function restoreChildren(n){
        const p = ensurePayload(n);
        if ((!n.children || !n.children.length) && p._children && p._children.length){
          n.children = p._children;
          p._children = [];
        }
      }
      function hasKids(n){
        const p = (n && n.payload) ? n.payload : {};
        return (n.children && n.children.length) || (p._children && p._children.length);
      }

      // Collapse to INIT_LEVEL (but keep _children so it’s expandable)
      function collapseToLevel(n, depth, showDepth){
        if (!n) return;
        ensurePayload(n);

        if (depth >= showDepth - 1) stashChildren(n);
        else restoreChildren(n);

        // Recurse through BOTH visible children and stashed children
        const p = n.payload;
        (n.children || []).forEach(ch => collapseToLevel(ch, depth + 1, showDepth));
        (p._children || []).forEach(ch => collapseToLevel(ch, depth + 1, showDepth));
      }

      // Hard cap MAX_LEVEL
      function capMaxDepth(n, depth, maxDepth){
        if (!n) return;
        ensurePayload(n);

        if (depth >= maxDepth) stashChildren(n);

        const p = n.payload;
        (n.children || []).forEach(ch => capMaxDepth(ch, depth + 1, maxDepth));
        (p._children || []).forEach(ch => capMaxDepth(ch, depth + 1, maxDepth));
      }

      async function fitClamped(maxK){
        if (!mm) return;
        try { await mm.fit(1.02); } catch(e) {}
        try {
          const k = (mm.state && mm.state.transform && mm.state.transform.k) ? mm.state.transform.k : 1;
          if (k > maxK) await mm.rescale(maxK / k); // rescale = MULTIPLIER
        } catch(e) {}
      }

      function rerender(){
        const live = (mm && mm.state && mm.state.data) ? mm.state.data : null;
        if (!live) return;
        mm.setData(live);
        setTimeout(()=>{ decorate(); }, 40);
      }

      function toggleDataNode(d){
        if (!d) return;
        ensurePayload(d);
        if (d.children && d.children.length) stashChildren(d);
        else restoreChildren(d);
        rerender();
      }

      function decorate(){
        svg.querySelectorAll("g.markmap-node").forEach(g=>{
          const inode = g.__data__;
          if (!inode || !inode.data) return;

          const d = inode.data;
          const depth = typeof inode.depth === "number" ? inode.depth : 0;

          const pill = g.querySelector(".markmap-foreign");
          if (!pill) return;

          pill.classList.remove("mm-depth-0","mm-depth-1","mm-depth-2","mm-depth-3","mm-depth-4","mm-depth-5","mm-depth-6");
          pill.classList.add("mm-depth-" + Math.min(depth, 6));

          // Ensure expander exists
          let exp = pill.querySelector(".mm-expander");
          if (!exp) {
            exp = document.createElement("span");
            exp.className = "mm-expander";
            pill.prepend(exp);
          }

          const kids = hasKids(d);
          if (!kids){
            exp.classList.add("mm-disabled");
            exp.textContent = "•";
          } else {
            exp.classList.remove("mm-disabled");
            exp.textContent = (d.children && d.children.length) ? "−" : "+";
          }

          if (pill.dataset.vatBound === "1") return;
          pill.dataset.vatBound = "1";

          // Click pill OR expander toggles
          exp.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); if (!hasKids(d)) return; toggleDataNode(d); });
          pill.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); if (!hasKids(d)) return; toggleDataNode(d); });
        });
      }

      async function renderMarkdown(md){
        const clean = String(md || "").trim();
        if (!clean) return;

        const { root } = transformer.transform(clean);
        setHeaderFrom(root && root.content ? root.content : "");

        collapseToLevel(root, 0, INIT_LEVEL);
        capMaxDepth(root, 0, MAX_LEVEL);

        initialData = deepClone(root);

        const opts = {
          autoFit:false,
          pan:true,
          zoom:true,
          scrollForPan:true,
          duration:0,                 // reduce “shudder”
          spacingHorizontal: 220,     // aligns levels into clear columns
          spacingVertical: 150,
          paddingX: 18,
          nodeMinHeight: 26,
          maxWidth: 560,
          color: () => "rgba(148,163,184,0.60)",
          lineWidth: () => 1.2
        };

        if (!mm) {
          mm = Markmap.create(svg, opts, root);

          // Zoom buttons: rescale is MULTIPLIER (this fixes "-" behaving wrong)
          document.getElementById("zoomIn").addEventListener("click", async ()=>{ try{ await mm.rescale(1.15); }catch(e){} });
          document.getElementById("zoomOut").addEventListener("click", async ()=>{ try{ await mm.rescale(1/1.15); }catch(e){} });

          document.getElementById("overview").addEventListener("click", async ()=>{ await fitClamped(1.05); });
          document.getElementById("readable").addEventListener("click", async ()=>{ try{ await mm.rescale(1.25); }catch(e){} });

          document.getElementById("reset").addEventListener("click", async ()=>{
            mm.setData(deepClone(initialData));
            setTimeout(async ()=>{ decorate(); await fitClamped(1.05); decorate(); }, 40);
          });

          document.getElementById("closeBtn").addEventListener("click", ()=>{
            try { window.parent && window.parent.postMessage({ type:"VAT_CLOSE" }, "*"); } catch(e) {}
          });

        } else {
          mm.setOptions(opts);
          mm.setData(root);
        }

        setTimeout(async ()=>{
          decorate();
          await fitClamped(1.05);
          decorate();
          try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_ACK" }, "*"); } catch(e) {}
        }, 60);
      }

      function extractMarkdown(data){
        if (!data) return "";
        if (typeof data === "string") return data;
        if (typeof data === "object"){
          if (typeof data.markdown === "string") return data.markdown;
          if (typeof data.md === "string") return data.md;
          if (typeof data.text === "string") return data.text;
        }
        return "";
      }

      // Listen for markdown from Squarespace
      window.addEventListener("message", (event)=>{
        const d = event.data || {};
        if (d.type === "VAT_MINDMAP_MD" || d.type === "MARKDOWN" || d.type === "MD" || !d.type) {
          const md = extractMarkdown(d);
          if (md) renderMarkdown(md);
        }
      });

      // Handshake so parent only posts when viewer ready
      try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_READY" }, "*"); } catch(e) {}
    })();
  </script>
</body>
</html>
