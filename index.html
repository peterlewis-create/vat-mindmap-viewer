<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    :root { color-scheme: dark; }
    html, body {
      height: 100%;
      margin: 0;
      background: #05070b;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      position: fixed;
      inset: 0 0 auto 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      z-index: 10;
    }

    header .title { font-weight: 600; letter-spacing: .2px; }
    header .status { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    main { position: fixed; inset: 44px 0 0 0; }
    svg#mindmap { width: 100%; height: 100%; display: block; }

    .hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      font-size: 12px;
      opacity: .7;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      padding: 8px 10px;
      z-index: 10;
      max-width: 70vw;
    }
  </style>
</head>

<body>
  <header>
    <div class="title">VAT Mindmap</div>
    <div id="status" class="status">Loading libraries…</div>
  </header>

  <main>
    <svg id="mindmap"></svg>
  </main>

  <div class="hint">
    Viewer ready for postMessage markdown.
  </div>

  <!-- Browser/global builds (window.markmap) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js"></script>

  <script>
    (function () {
      // CHANGE THIS to 5 if you want a stricter cap
      const MAX_DEPTH = 6;

      const statusEl = document.getElementById('status');

      let transformer = null;
      let mm = null;

      function setStatus(msg, isError) {
        statusEl.textContent = msg;
        statusEl.style.opacity = isError ? '1' : '.85';
      }

      function getAPI() {
        const m = window.markmap;
        if (!m) return null;

        const Markmap = m.Markmap;
        const Transformer = m.Transformer;

        if (!Markmap || !Transformer) return null;

        return {
          Markmap,
          Transformer,
          loadCSS: m.loadCSS,
          loadJS: m.loadJS,
        };
      }

      // Hard cap depth by pruning children beyond MAX_DEPTH
      function pruneToDepth(node, maxDepth, depth = 1) {
        if (!node) return node;
        if (depth >= maxDepth) {
          if (node.children) node.children = [];
          return node;
        }
        if (Array.isArray(node.children)) {
          node.children.forEach((c) => pruneToDepth(c, maxDepth, depth + 1));
        }
        return node;
      }

      function renderMarkdown(markdown) {
        const api = getAPI();
        if (!api) {
          console.error('Markmap API not available. window.markmap =', window.markmap);
          setStatus('Error: Markmap not found (CDN scripts not loaded).', true);
          return;
        }

        try {
          transformer = transformer || new api.Transformer();

          const { root, features } = transformer.transform(String(markdown || ''));

          // Apply depth cap (5–6 levels as requested)
          pruneToDepth(root, MAX_DEPTH);

          // Load optional assets if used (katex/hljs etc)
          if (typeof transformer.getUsedAssets === 'function' && api.loadCSS && api.loadJS) {
            const assets = transformer.getUsedAssets(features);
            if (assets?.styles?.length) api.loadCSS(assets.styles);
            if (assets?.scripts?.length) api.loadJS(assets.scripts);
          }

          if (!mm) {
            mm = api.Markmap.create('svg#mindmap', null, root);
          } else {
            mm.setData(root);
          }

          requestAnimationFrame(() => mm.fit());
          setStatus('Rendered. Waiting for updates…', false);
        } catch (e) {
          console.error(e);
          setStatus('Error rendering markdown (see console).', true);
        }
      }

      // Receive markdown via postMessage
      // Supported payloads:
      // 1) string
      // 2) { type: "VAT_MINDMAP_MD", markdown: "..." }
      // 3) { type: "FIT" }
      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data) return;

        if (typeof data === 'string') {
          renderMarkdown(data);
          return;
        }

        if (typeof data === 'object') {
          const t = String(data.type || '').toUpperCase();

          if (t === 'FIT') {
            if (mm) mm.fit();
            return;
          }

          if (t === 'VAT_MINDMAP_MD' || t === 'MARKMAP_MD' || t === 'MARKDOWN') {
            renderMarkdown(data.markdown);
            return;
          }
        }
      });

      // Initial placeholder (kept minimal)
      renderMarkdown('# VAT Mindmap\n## Status\n- Waiting for markdown…\n');

      // Confirm libs
      const ok = !!getAPI();
      if (ok) setStatus('Rendered. Waiting for updates…', false);
      else setStatus('Error: libraries did not load.', true);
    })();
  </script>
</body>
</html>
