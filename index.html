<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #0b0f16;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fullscreen SVG */
    #mm {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #0b0f16;
    }

    /* Subtle links */
    .markmap-link { stroke: rgba(148, 163, 184, 0.35); }

    /* Node "pill" styling (NotebookLM-ish) */
    .markmap-foreign {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(55, 65, 81, 0.95);   /* slate-ish */
      border: 1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
      box-shadow: 0 10px 30px rgba(0,0,0,0.28);
      backdrop-filter: blur(6px);
      max-width: 520px; /* keeps long nodes from stretching too far */
    }
    .markmap-foreign a { color: rgba(255,255,255,0.92); text-decoration: none; }
    .markmap-foreign a:hover { text-decoration: underline; }

    /* Make the root a touch bolder */
    .markmap-node:first-child .markmap-foreign {
      font-weight: 800;
      background: rgba(31, 41, 55, 0.95);
    }

    /* Optional status (hidden in embed=1) */
    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.30);
      color: rgba(255,255,255,.82);
      font-size: 12px;
      font-weight: 650;
      user-select: none;
    }
    #status.hidden { display: none; }
  </style>

  <!-- Markmap (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view/dist/browser/index.min.js"></script>
</head>

<body>
  <div id="status">Waiting for markdown…</div>
  <svg id="mm"></svg>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);

      // embed=1 => hide status (Squarespace overlay already has controls)
      const EMBED = params.get("embed") === "1";

      // depth=5 => shows up to ~6 heading levels (# .. ######), collapses deeper
      // (Root depth=0, children depth=1, etc.)
      const MAX_DEPTH = Math.max(1, parseInt(params.get("depth") || "5", 10));

      const statusEl = document.getElementById("status");
      if (EMBED) statusEl.classList.add("hidden");

      const svg = document.getElementById("mm");
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;

      const transformer = new Transformer();
      let mm = null;

      function setStatus(msg) {
        if (!statusEl || statusEl.classList.contains("hidden")) return;
        statusEl.textContent = msg;
      }

      function collapseBeyondDepth(node, depth) {
        if (!node) return;
        const payload = node.payload || (node.payload = {});
        if (depth >= MAX_DEPTH) {
          // Markmap respects payload.fold for collapsing
          payload.fold = 1;
          node.folded = true; // extra compatibility
        }
        if (node.children && node.children.length) {
          for (const ch of node.children) collapseBeyondDepth(ch, depth + 1);
        }
      }

      function renderMarkdown(md) {
        const clean = String(md || "").trim();
        if (!clean) {
          setStatus("No markdown received.");
          return;
        }

        setStatus("Rendering…");

        const { root } = transformer.transform(clean);

        // Collapse deeper branches for big taxonomies
        collapseBeyondDepth(root, 0);

        if (!mm) {
          mm = Markmap.create(svg, {
            duration: 240
          }, root);
        } else {
          mm.setData(root);
        }

        // Fit after layout settles
        setTimeout(() => {
          try { mm.fit(); } catch (e) {}
          setStatus("Ready");
          if (!EMBED) {
            setTimeout(() => setStatus("Ready (click nodes to expand/collapse)"), 600);
          }
        }, 50);
      }

      function extractMarkdown(data) {
        if (!data) return "";
        if (typeof data === "string") return data;
        if (typeof data === "object") {
          if (typeof data.markdown === "string") return data.markdown;
          if (typeof data.md === "string") return data.md;
          if (typeof data.text === "string") return data.text;
        }
        return "";
      }

      // Listen for parent messages
      window.addEventListener("message", (event) => {
        const d = event.data;

        // Accept the VAT message type, plus a couple fallbacks
        const type = (d && typeof d === "object" && d.type) ? d.type : "";

        if (type === "VAT_MINDMAP_MD" || type === "MARKDOWN" || type === "MD" || type === "") {
          const md = extractMarkdown(d);
          if (md) renderMarkdown(md);
          return;
        }

        if (type === "FIT") {
          if (mm) {
            try { mm.fit(); } catch (e) {}
          }
          return;
        }
      });

      // Handshake so Squarespace knows when to post
      function notifyReady() {
        try {
          window.parent && window.parent.postMessage({ type: "VAT_MINDMAP_READY" }, "*");
        } catch (e) {}
      }

      window.addEventListener("load", notifyReady);
      notifyReady();
      setStatus("Waiting for markdown…");
    })();
  </script>
</body>
</html>
