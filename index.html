<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>
  <style>
    :root {
      --bg0: #0b0f14;
      --panel: rgba(15, 23, 36, 0.9);
      --text: #ffffff;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg0);
      overflow: hidden;
      font-family: sans-serif;
      color: var(--text);
    }

    #svg { width: 100vw; height: 100vh; display: block; }

    /* Header Styling */
    #header {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 100;
      pointer-events: none;
    }
    #title { font-size: 26px; font-weight: 800; margin: 0; color: #fff; }
    #subtitle { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 4px; }

    /* Node Readability & Vertical Spacing */
    .markmap-foreign {
      background: rgba(255, 255, 255, 0.15) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      border-radius: 12px !important;
      padding: 10px 16px !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 15px !important;
      /* Prevent skinny nodes */
      min-width: 120px;
      text-align: center;
    }

    .markmap-foreign div { color: #ffffff !important; }

    /* Line (Link) Thickness */
    .markmap-link {
      stroke: rgba(255,255,255,0.2) !important;
      stroke-width: 2.5px !important;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>

  <svg id="svg" class="markmap"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function () {
      const { Transformer, Markmap } = window.markmap;
      const svg = document.querySelector('#svg');
      const titleEl = document.querySelector('#title');
      const subEl = document.querySelector('#subtitle');
      let mm = null;
      const transformer = new Transformer();

      window.addEventListener('message', (ev) => {
        const msg = ev.data;
        if (msg.type !== 'VAT_SET') return;

        // Set Headers
        titleEl.textContent = msg.title || "";
        subEl.textContent = `Based on ${msg.sourcesCount || 0} sources`;

        const { root } = transformer.transform(msg.markdown || '');

        if (!mm) {
          mm = Markmap.create(svg, {
            autoFit: true,
            duration: 400,
            /* INCREASED VERTICAL SPACING HERE */
            spacingVertical: 40,   
            spacingHorizontal: 160,
            paddingX: 20,
          }, root);
        } else {
          mm.setData(root);
          mm.fit();
        }
      });

      window.parent.postMessage({ type: 'VAT_READY' }, '*');
    })();
  </script>
</body>
</html>
