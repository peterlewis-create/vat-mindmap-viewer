<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>
  <style>
    /* FORCE SOLID COLORS */
    :root {
      --bg: #0b0f14;
      --box-bg: #161e27; 
      --text: #ffffff;
      --border: #3b82f6;
    }
    html, body { 
      height: 100% !important; margin: 0 !important; 
      background-color: var(--bg) !important; 
      overflow: hidden !important; 
      font-family: sans-serif !important; 
    }
    #svg { width: 100vw; height: 100vh; display: block; background-color: var(--bg); }

    /* HEADER & BUTTONS */
    #header { position: fixed; top: 30px; left: 30px; z-index: 9999; pointer-events: none; }
    #title { font-size: 32px; font-weight: 800; color: #fff; margin: 0; }
    #subtitle { font-size: 16px; color: #94a3b8; margin-top: 5px; }
    
    #toolbar { position: fixed; top: 30px; right: 30px; z-index: 10000; display: flex; gap: 12px; }
    .tb-btn { 
      background: #1f2937 !important; border: 2px solid #4b5563 !important; 
      color: #fff !important; min-width: 50px; height: 50px; border-radius: 12px; 
      cursor: pointer; font-weight: 800; font-size: 22px; display: flex; 
      align-items: center; justify-content: center; box-shadow: 0 10px 15px rgba(0,0,0,0.5);
    }
    .tb-btn.txt { font-size: 15px; width: auto; padding: 0 20px; }
    .tb-btn:hover { background: #374151 !important; border-color: #fff !important; }

    /* THE TEXT BOX FIX */
    .markmap-foreign {
      background-color: var(--box-bg) !important; /* Forces solid background */
      border: 3px solid var(--border) !important; /* Thick bright border */
      border-radius: 12px !important;
      padding: 15px 25px !important; /* Bigger boxes */
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 18px !important; 
      box-shadow: 0 15px 30px rgba(0,0,0,0.8) !important;
      white-space: nowrap !important;
    }
    .markmap-foreign div { color: #ffffff !important; background: transparent !important; }
    
    /* BRANCH LINES */
    .markmap-link { stroke: #4b5563 !important; stroke-width: 3px !important; }
  </style>
</head>
<body>
  <div id="header">
    <div id="title">Taxonomy: Animals, Food, and Catering</div>
    <div id="subtitle">Based on 179 sources</div>
  </div>
  <div id="toolbar">
    <button class="tb-btn" id="zin">+</button>
    <button class="tb-btn" id="zout">−</button>
    <button class="tb-btn txt" id="res">Resize</button>
    <button class="tb-btn txt" id="cls">Close</button>
  </div>
  <svg id="svg" class="markmap"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function () {
      const { Transformer, Markmap } = window.markmap;
      const svg = document.querySelector('#svg');
      let mm = null;
      const trans = new Transformer();

      window.addEventListener('message', (ev) => {
        if (ev.data.type !== 'VAT_SET') return;
        const { root } = trans.transform(ev.data.markdown || '');
        if (!mm) {
          mm = Markmap.create(svg, {
            autoFit: true,
            spacingVertical: 80, /* Massive spacing to prevent "narrow" look */
            spacingHorizontal: 200,
          }, root);
        } else {
          mm.setData(root); mm.fit();
        }
      });

      // BLOCK PROPAGATION: Prevents buttons from clicking "through" to background
      const setupBtn = (id, fn) => {
        const b = document.getElementById(id);
        b.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation(); fn();
        }, true);
      };

      setupBtn('zin', () => mm.rescale(1.3));
      setupBtn('zout', () => mm.rescale(0.7));
      setupBtn('res', () => mm.fit());
      setupBtn('cls', () => window.parent.postMessage({type:'VAT_CLOSE'}, '*'));

      window.parent.postMessage({ type: 'VAT_READY' }, '*');
    })();
  </script>
</body>
</html>
