<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      background:#0b0f16;
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    #mm{ width:100vw; height:100vh; display:block; background:#0b0f16; }
    .markmap-link{ opacity:0.40; }

    /* BIGGER + readable */
    .markmap-foreign{
      display:inline-block;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(55,65,81,0.84);
      border:1px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.94);
      box-shadow:0 12px 34px rgba(0,0,0,0.30);
      backdrop-filter:blur(7px);

      font-size:17px;         /* <<< bigger */
      line-height:1.20;

      max-width:360px;        /* still capped so routes don't explode */
      white-space:normal;
      word-break:break-word;
      hyphens:auto;
    }

    #uiBar{
      position:fixed;
      right:14px;
      top:14px;
      z-index:20;
      display:flex;
      gap:8px;
      align-items:center;
      padding:10px 10px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.32);
      backdrop-filter:blur(8px);
      user-select:none;
    }
    #uiBar button{
      appearance:none;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.92);
      border-radius:12px;
      padding:9px 10px;
      font:800 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      cursor:pointer;
    }
    #uiBar button:hover{ background:rgba(255,255,255,.10); }
    #uiBar .sep{ width:1px; height:22px; background:rgba(255,255,255,.14); margin:0 2px; }

    #hint{
      position:fixed;
      left:12px;
      top:12px;
      z-index:10;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.30);
      color:rgba(255,255,255,.82);
      font-size:12px;
      font-weight:650;
      user-select:none;
    }
    #hint.hidden{ display:none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view/dist/browser/index.min.js"></script>
</head>

<body>
  <div id="hint">Click: expand/collapse • Shift+Click: focus route • Drag to pan • +/- to zoom • Esc: reset</div>

  <div id="uiBar">
    <button id="zoomIn" type="button">+</button>
    <button id="zoomOut" type="button">−</button>
    <button id="fit" type="button">Fit</button>
    <div class="sep"></div>
    <button id="reset" type="button">Reset</button>
  </div>

  <svg id="mm"></svg>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const EMBED = params.get("embed") === "1";
      if (EMBED) document.getElementById("hint").classList.add("hidden");

      const INIT_LEVEL = Math.max(1, parseInt(params.get("init") || "2", 10));
      const MAX_LEVEL  = Math.max(INIT_LEVEL, parseInt(params.get("max")  || "6", 10));

      // FORCE readability:
      const TARGET_SCALE = 1.45;  // start here
      const MIN_SCALE    = 1.20;  // never allow smaller (this is what fixes unreadable text)
      const MAX_SCALE    = 2.80;

      const svg = document.getElementById("mm");
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;
      const transformer = new Transformer();

      const palette = ["#60a5fa","#34d399","#fbbf24","#a78bfa","#fb7185","#22d3ee","#f472b6","#94a3b8"];
      const branchColor = d3.scaleOrdinal(palette);

      let mm = null;
      let initialRoot = null;
      let liveRoot = null;

      function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

      function currentScale(){
        return (mm && mm.state && mm.state.transform && typeof mm.state.transform.k === "number")
          ? mm.state.transform.k
          : 1;
      }

      async function rescaleClamped(k){
        if (!mm) return;
        const kk = Math.max(MIN_SCALE, Math.min(MAX_SCALE, k));
        try { await mm.rescale(kk); } catch(e) {}
      }

      // Keep end of expanded route visible (PAN, not shrink)
      function rightMostOpen(inode){
        let cur = inode;
        while (cur && cur.children && cur.children.length) {
          const kids = cur.children;
          const last = kids[kids.length - 1];
          if (last && last.data && last.data.payload && last.data.payload.fold === 1) break;
          cur = last;
        }
        return cur || inode;
      }

      async function keepEndVisible(inode){
        if (!mm || !inode) return;
        // ensure readable scale
        await rescaleClamped(Math.max(currentScale(), TARGET_SCALE));
        // pan to end node
        const end = rightMostOpen(inode);
        try { await mm.ensureVisible(end, { left:90, right:160, top:90, bottom:90 }); } catch(e) {}
      }

      function collapseBeyond(node, depth, maxDepth){
        if (!node) return;
        node.payload ||= {};
        if (depth >= maxDepth) node.payload.fold = 1;
        if (node.children) node.children.forEach(ch => collapseBeyond(ch, depth+1, maxDepth));
      }

      function reset(){
        if (!initialRoot || !mm) return;
        liveRoot = deepClone(initialRoot);
        mm.setData(liveRoot);
        setTimeout(async ()=>{
          await rescaleClamped(TARGET_SCALE);
          try { await mm.fit(1.02); } catch(e) {}  // gentle center only
          await rescaleClamped(Math.max(currentScale(), TARGET_SCALE));
          bindNodeHandlers();
        }, 30);
      }

      function focusRoute(inode){
        if (!inode || !inode.parent || !liveRoot || !liveRoot.children) return;

        const path = new Set();
        let p = inode;
        while (p) { path.add(p.data); p = p.parent; }

        liveRoot.children.forEach(ch=>{
          ch.payload ||= {};
          ch.payload.fold = path.has(ch) ? 0 : 1;
        });

        (function openPath(node){
          if (!node) return;
          node.payload ||= {};
          if (path.has(node)) node.payload.fold = 0;
          if (node.children) node.children.forEach(openPath);
        })(liveRoot);

        mm.setData(liveRoot);
        setTimeout(()=>keepEndVisible(inode), 30);
      }

      function bindNodeHandlers(){
        svg.querySelectorAll("g.markmap-node").forEach(g=>{
          if (g.dataset.vatBound === "1") return;
          g.dataset.vatBound = "1";
          g.style.cursor = "pointer";

          g.addEventListener("click", (e)=>{
            const inode = g.__data__;
            if (!inode) return;

            if (e.shiftKey) {
              setTimeout(()=>focusRoute(inode), 0);
              return;
            }
            // Normal click: toggle then pan to keep end visible (no shrinking)
            setTimeout(()=>keepEndVisible(inode), 0);
          });
        });
      }

      async function renderMarkdown(md){
        const clean = String(md || "").trim();
        if (!clean) return;

        const { root } = transformer.transform(clean);
        collapseBeyond(root, 0, MAX_LEVEL);

        initialRoot = deepClone(root);
        liveRoot = deepClone(root);

        const opts = {
          autoFit:false,
          pan:true,
          zoom:true,
          scrollForPan:true,
          duration:220,

          spacingHorizontal: 150,
          spacingVertical: 105,   // helps 3–4 children spread vertically
          paddingX: 18,
          nodeMinHeight: 24,
          maxWidth: 360,

          initialExpandLevel: INIT_LEVEL,

          color: (node) => {
            if (!node || !node.parent) return "rgba(148,163,184,0.55)";
            let p = node;
            while (p.parent && p.parent.parent) p = p.parent;
            const key = (p && p.data && p.data.content) ? p.data.content : "branch";
            return branchColor(key);
          },
          lineWidth: () => 1.20,
        };

        if (!mm) {
          mm = Markmap.create(svg, opts, liveRoot);

          document.getElementById("zoomIn").addEventListener("click", () => rescaleClamped(currentScale() * 1.15));
          document.getElementById("zoomOut").addEventListener("click", () => rescaleClamped(currentScale() / 1.15));
          document.getElementById("fit").addEventListener("click", async () => {
            try { await mm.fit(1.02); } catch(e) {}
          });
          document.getElementById("reset").addEventListener("click", reset);

          document.addEventListener("keydown", (e)=>{
            if (e.key === "Escape") reset();
            if (e.key === "+" || e.key === "=") rescaleClamped(currentScale() * 1.15);
            if (e.key === "-" || e.key === "_") rescaleClamped(currentScale() / 1.15);
            if (e.key === "0") rescaleClamped(TARGET_SCALE);
          });
        } else {
          mm.setOptions(opts);
          mm.setData(liveRoot);
        }

        // Start readable + centered
        setTimeout(async ()=>{
          await rescaleClamped(TARGET_SCALE);
          try { await mm.fit(1.02); } catch(e) {}
          await rescaleClamped(Math.max(currentScale(), TARGET_SCALE));
          bindNodeHandlers();
        }, 40);
      }

      function extractMarkdown(data){
        if (!data) return "";
        if (typeof data === "string") return data;
        if (typeof data === "object"){
          if (typeof data.markdown === "string") return data.markdown;
          if (typeof data.md === "string") return data.md;
          if (typeof data.text === "string") return data.text;
        }
        return "";
      }

      window.addEventListener("message", (event)=>{
        const d = event.data;
        const type = (d && typeof d === "object" && d.type) ? d.type : "";
        if (type === "VAT_MINDMAP_MD" || type === "MARKDOWN" || type === "MD" || type === "") {
          const md = extractMarkdown(d);
          if (md) renderMarkdown(md);
        }
      });

      function notifyReady(){
        try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_READY" }, "*"); } catch(e) {}
      }
      window.addEventListener("load", notifyReady);
      notifyReady();
    })();
  </script>
</body>
</html>
