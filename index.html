<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: rgba(255,255,255,.85);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    #wrap {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.55);
      user-select: none;
    }
    #title {
      font-weight: 600;
      letter-spacing: .2px;
    }
    #status {
      font-size: 12px;
      opacity: .8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #hint {
      margin-left: auto;
      font-size: 12px;
      opacity: .65;
      white-space: nowrap;
    }
    #mindmap {
      width: 100%;
      height: calc(100% - 44px);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="topbar">
      <div id="title">VAT Mindmap</div>
      <div id="status">Waiting for updates…</div>
      <div id="hint">Double-click a node to focus. Esc to reset.</div>
    </div>
    <svg id="mindmap"></svg>
  </div>

  <!-- CDN libs -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.3"></script>
