<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>
  <style>
    :root{
      --bg0:#0b0f14;
      --bg1:#0a1118;
      --panel: rgba(15, 23, 36, 0.72);
      --panel2: rgba(15, 23, 36, 0.55);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.62);
      --btn: rgba(255,255,255,0.10);
      --btnHover: rgba(255,255,255,0.16);
      --nodeBg: rgba(255,255,255,0.10);
      --nodeBgLeaf: rgba(62, 160, 96, 0.22);
      --nodeBorder: rgba(255,255,255,0.14);
      --shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 700px at 30% 20%, #0d1520 0%, var(--bg0) 45%, #070b10 100%);
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
    }

    /* Fullscreen canvas */
    #svg {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Header (NotebookLM style) */
    #header {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 50;
      pointer-events: none;
      max-width: min(900px, calc(100vw - 360px));
    }
    #title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 6px 0;
      text-shadow: 0 8px 24px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    #subtitle {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin: 0;
      pointer-events: none;
    }

    /* Toolbar (top-right) */
    #toolbar {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 60;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .tb-btn {
      appearance: none;
      border: 1px solid var(--stroke);
      background: var(--btn);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }
    .tb-btn:hover { background: var(--btnHover); }
    .tb-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 16px;
      padding: 0;
      display: grid;
      place-items: center;
    }

    /* Markmap styling overrides */
    .markmap {
      background: transparent !important;
    }
    /* Link curves */
    .markmap-link {
      stroke: rgba(255,255,255,0.20) !important;
      stroke-width: 1.35 !important;
    }

    /* Node pills rendered inside foreignObject */
    .markmap-foreign {
      background: var(--nodeBg);
      border: 1px solid var(--nodeBorder);
      border-radius: 999px;
      padding: 9px 14px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 320px; /* keeps vertical alignment by forcing wrapping */
      pointer-events: auto; /* allow clicking expander */
    }
    /* leaf nodes slightly greener */
    .vat-leaf .markmap-foreign {
      background: var(--nodeBgLeaf);
    }

    /* label text: wrap and stay readable */
    .markmap-foreign > div,
    .markmap-foreign {
      color: var(--text) !important;
      font-weight: 800 !important;
      font-size: 14px !important;
      line-height: 1.15 !important;
      white-space: normal !important;
      word-break: break-word !important;
      text-wrap: pretty;
    }

    /* expander button (right side of pill) */
    .vat-expander {
      margin-left: 6px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.10);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      padding: 0;
      line-height: 1;
      font-weight: 900;
      pointer-events: auto;
    }
    .vat-expander:hover { background: rgba(255,255,255,0.16); }

    /* Mobile: shrink header a bit */
    @media (max-width: 640px) {
      #title { font-size: 20px; }
      #toolbar { transform: scale(0.92); transform-origin: top right; }
      .markmap-foreign { max-width: 260px; }
    }
  </style>
</head>

<body>
  <div id="header">
    <h1 id="title">UK VAT - Food, Drink and Animal Feed</h1>
    <p id="subtitle">Based on 0 sources</p>
  </div>

  <div id="toolbar">
    <button class="tb-btn tb-icon" id="zoomIn"  title="Zoom in">+</button>
    <button class="tb-btn tb-icon" id="zoomOut" title="Zoom out">−</button>
    <button class="tb-btn" id="overview" title="Return to opening view (Level 1–2)">Overview</button>
    <button class="tb-btn" id="readable" title="Toggle larger text">Readable</button>
    <button class="tb-btn" id="reset" title="Reset view">Reset</button>
    <button class="tb-btn" id="close" title="Close">Close</button>
  </div>

  <svg id="svg" class="markmap"></svg>

  <!-- Markmap dependencies (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function () {
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;

      const svg = document.querySelector('#svg');
      const titleEl = document.querySelector('#title');
      const subEl = document.querySelector('#subtitle');

      let mm = null;
      let transformer = new Transformer();
      let lastMsg = null;
      let readable = false;

      // For stable zoom behaviour:
      function getScale() {
        try { return (mm && mm.state && mm.state.transform && mm.state.transform.k) ? mm.state.transform.k : 1; }
        catch { return 1; }
      }
      function setScale(newK) {
        if (!mm) return;
        const k = Math.max(0.2, Math.min(4, newK));
        mm.rescale(k);
      }

      function buildMap(markdown) {
        const { root } = transformer.transform(markdown || '');
        if (!mm) {
          mm = Markmap.create(svg, {
            autoFit: false,              // prevents “shudder”
            pan: true,
            scrollForPan: false,
            duration: 180,
            maxWidth: 320,               // forces wrapping => levels align better
            nodeMinHeight: 18,
            paddingX: 10,
            spacingHorizontal: 110,
            spacingVertical: 12,
            initialExpandLevel: 2,        // OPENING VIEW: Level 1–2 only
            embedGlobalCSS: true,
          }, root);
        } else {
          mm.setData(root, {
            initialExpandLevel: 2
          });
        }

        // Fit once after render
        setTimeout(() => mm && mm.fit(), 60);
        setTimeout(() => decorateExpanders(), 90);
      }

      function isFolded(inode) {
        return !!(inode && inode.payload && inode.payload.fold);
      }

      function hasChildren(inode) {
        return !!(inode && inode.children && inode.children.length);
      }

      function decorateExpanders() {
        if (!mm) return;

        // Node groups are bound to INode objects on g.__data__
        const nodeGs = svg.querySelectorAll('g');
        nodeGs.forEach(g => {
          const inode = g.__data__;
          if (!inode || !inode.payload) return;

          // Mark leaf nodes so we can style them
          if (!hasChildren(inode)) g.classList.add('vat-leaf'); else g.classList.remove('vat-leaf');

          const fo = g.querySelector('foreignObject');
          if (!fo) return;

          const container =
            fo.querySelector('.markmap-foreign') ||
            fo.querySelector('div') ||
            null;

          if (!container) return;

          // Remove old expander if any
          const existing = container.querySelector('.vat-expander');
          if (existing) existing.remove();

          if (!hasChildren(inode)) return;

          // Add expander button (NotebookLM-style chevron)
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'vat-expander';
          btn.setAttribute('aria-label', 'Expand/collapse');
          btn.textContent = isFolded(inode) ? '›' : '‹';

          // IMPORTANT: stop pan/zoom drag on click
          btn.addEventListener('pointerdown', (e) => { e.stopPropagation(); }, { passive: false });

          btn.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!mm) return;

            try {
              await mm.toggleNode(inode);
              // Keep the clicked node in view
              if (mm.ensureVisible) await mm.ensureVisible(inode, { top: 90, right: 40, bottom: 40, left: 40 });
            } catch (_) { /* ignore */ }

            // Redecorate after the DOM updates
            requestAnimationFrame(() => decorateExpanders());
          });

          container.appendChild(btn);
        });
      }

      function applyReadableMode(on) {
        readable = !!on;
        document.documentElement.style.setProperty('--nodeBg', readable ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.10)');
        // bump font sizes by toggling a class-like effect
        const style = document.getElementById('vatReadableStyle');
        if (readable) {
          if (!style) {
            const s = document.createElement('style');
            s.id = 'vatReadableStyle';
            s.textContent = `
              .markmap-foreign > div, .markmap-foreign {
                font-size: 16px !important;
              }
              #title { font-size: 30px; }
            `;
            document.head.appendChild(s);
          }
        } else {
          if (style) style.remove();
        }
        if (mm) setTimeout(() => mm.fit(), 40);
      }

      // Toolbar actions
      document.getElementById('zoomIn').addEventListener('click', () => setScale(getScale() * 1.15));
      document.getElementById('zoomOut').addEventListener('click', () => setScale(getScale() / 1.15));

      document.getElementById('overview').addEventListener('click', () => {
        if (lastMsg && lastMsg.markdown) {
          // Rebuild with initialExpandLevel=2
          buildMap(lastMsg.markdown);
        } else if (mm) {
          mm.fit();
        }
      });

      document.getElementById('readable').addEventListener('click', () => applyReadableMode(!readable));

      document.getElementById('reset').addEventListener('click', () => {
        applyReadableMode(false);
        if (lastMsg && lastMsg.markdown) buildMap(lastMsg.markdown);
        else if (mm) mm.fit();
      });

      document.getElementById('close').addEventListener('click', () => {
        window.parent && window.parent.postMessage({ type: 'VAT_CLOSE' }, '*');
      });

      // Messaging handshake
      window.addEventListener('message', (ev) => {
        const msg = ev.data || {};
        if (msg.type !== 'VAT_SET') return;

        lastMsg = msg;

        // Header text (prevents “&amp;” issues because we use textContent)
        if (typeof msg.title === 'string' && msg.title.trim()) titleEl.textContent = msg.title.trim();
        if (typeof msg.sourcesCount === 'number') subEl.textContent = `Based on ${msg.sourcesCount} sources`;

        buildMap(String(msg.markdown || ''));

        // ack back to parent
        window.parent && window.parent.postMessage({ type: 'VAT_READY_ACK' }, '*');
      });

      // Tell parent we're ready
      window.parent && window.parent.postMessage({ type: 'VAT_READY' }, '*');

      // ESC closes
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.parent && window.parent.postMessage({ type: 'VAT_CLOSE' }, '*');
        }
      });
    })();
  </script>
</body>
</html>
