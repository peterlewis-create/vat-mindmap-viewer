<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>
  <style>
    :root { --bg:#0b0f14; --text:#ffffff; }
    html, body {
      height: 100%; margin: 0; background: var(--bg);
      overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
    }
    #svg { width: 100vw; height: 100vh; display: block; }

    /* Header */
    #header { position: fixed; top: 22px; left: 22px; z-index: 999; pointer-events: none; }
    #title { font-size: 28px; font-weight: 900; margin: 0; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    #subtitle { font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 6px; }

    /* Toolbar */
    #toolbar {
      position: fixed; top: 22px; right: 22px; z-index: 1000;
      display: flex; gap: 10px; pointer-events: auto;
    }
    .tb-btn {
      background: #1f2937;
      border: 2px solid rgba(255,255,255,0.45);
      color: #fff;
      min-width: 46px; height: 46px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 900;
      font-size: 20px;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      user-select: none;
    }
    .tb-btn.text-btn { font-size: 14px; padding: 0 16px; width: auto; }
    .tb-btn:hover { background: #374151; border-color: #fff; }

    /* Box readability */
    .markmap-foreign {
      background: #111827 !important;
      border: 2px solid #3b82f6 !important;
      border-radius: 10px !important;
      padding: 12px 20px !important;
      color: #ffffff !important;
      font-weight: 900 !important;
      font-size: 16px !important;
      box-shadow: 0 10px 24px rgba(0,0,0,0.65);
      white-space: nowrap;
    }
    .markmap-foreign div { color: #ffffff !important; }
    .markmap-link { stroke: rgba(255,255,255,0.40) !important; stroke-width: 2.5px !important; }
  </style>
</head>

<body>
  <div id="header">
    <div id="title">Taxonomy: Animals, Food, and Catering</div>
    <div id="subtitle" id="lvl">Expand level: 2</div>
  </div>

  <div id="toolbar">
    <button class="tb-btn" id="plus"  type="button" title="Expand one level">+</button>
    <button class="tb-btn" id="minus" type="button" title="Collapse one level">−</button>
    <button class="tb-btn text-btn" id="fit"   type="button">Resize</button>
    <button class="tb-btn text-btn" id="close" type="button">Close</button>
  </div>

  <svg id="svg" class="markmap"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function () {
      const { Transformer, Markmap } = window.markmap;
      const svg = document.querySelector('#svg');
      const transformer = new Transformer();

      let mm = null;
      let baseRoot = null;
      let expandLevel = 2; // show first 2 levels by default

      function clone(obj) {
        if (typeof structuredClone === 'function') return structuredClone(obj);
        return JSON.parse(JSON.stringify(obj));
      }

      function applyFoldByDepth(node, depth, maxDepth) {
        // Collapse children starting at maxDepth (depth 0 = root)
        if (!node || !node.children) return;

        if (!node.payload) node.payload = {};

        if (depth >= maxDepth) {
          // This node stays visible, but its children are hidden
          node.payload.fold = 1;
        } else {
          node.payload.fold = 0;
          for (const child of node.children) {
            applyFoldByDepth(child, depth + 1, maxDepth);
          }
        }
      }

      function render() {
        if (!baseRoot) return;

        const root = clone(baseRoot);
        applyFoldByDepth(root, 0, expandLevel);

        if (!mm) {
          mm = Markmap.create(svg, {
            autoFit: true,
            spacingVertical: 60,
            spacingHorizontal: 160,
          }, root);
        } else {
          mm.setData(root);
          mm.fit();
        }

        const lvl = document.getElementById('lvl');
        if (lvl) lvl.textContent = 'Expand level: ' + expandLevel;
      }

      window.addEventListener('message', (ev) => {
        if (!ev.data || ev.data.type !== 'VAT_SET') return;

        expandLevel = Number(ev.data.expandLevel || 2);
        if (!Number.isFinite(expandLevel)) expandLevel = 2;
        expandLevel = Math.max(1, Math.min(10, expandLevel));

        const { root } = transformer.transform(String(ev.data.markdown || ''));
        baseRoot = root;
        render();
      });

      function safe(fn){
        return function(e){
          e.preventDefault(); e.stopPropagation();
          if (!mm && fn !== render) return;
          fn();
        };
      }

      document.getElementById('plus').addEventListener('click', safe(() => {
        expandLevel = Math.min(10, expandLevel + 1);
        render();
      }), true);

      document.getElementById('minus').addEventListener('click', safe(() => {
        expandLevel = Math.max(1, expandLevel - 1);
        render();
      }), true);

      document.getElementById('fit').addEventListener('click', safe(() => {
        if (mm) mm.fit();
      }), true);

      document.getElementById('close').addEventListener('click', safe(() => {
        window.parent.postMessage({ type: 'VAT_CLOSE' }, '*');
      }), true);

      window.parent.postMessage({ type: 'VAT_READY' }, '*');
    })();
  </script>
</body>
</html>
