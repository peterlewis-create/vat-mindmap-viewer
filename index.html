<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAT Mindmap</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at center, #0d1b2a, #000);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #mindmap {
      width: 100vw;
      height: 100vh;
    }
    #header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      font-weight: bold;
      z-index: 10;
      border-bottom: 1px solid #00aaff;
    }
  </style>
</head>

<body>
  <div id="header">VAT Mindmap</div>
  <svg id="mindmap"></svg>

  <!-- Load D3 and Markmap (stable versions) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.3/dist/browser/index.min.js"></script>

  <script>
    // Confirm libraries loaded
    console.log("D3 loaded:", typeof d3 !== "undefined");
    console.log("Markmap object:", window.markmap);

    const { Markmap, Transformer } = window.markmap;
    const transformer = new Transformer();

    const md = `
# VAT
## Animal feed
- Pet food exceptions
- Working animals
## Food & drink
- Catering rules
- Takeaway vs eat-in
`;

    const { root } = transformer.transform(md);
    Markmap.create("#mindmap", { initialExpandLevel: 2 }, root);
  </script>
</body>
</html>
