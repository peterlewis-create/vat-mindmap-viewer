<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      background:#0b0f16;
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    #mm{ width:100vw; height:100vh; display:block; background:#0b0f16; }
    .markmap-link{ opacity:0.40; }

    /* Prevent wrapped text clipping */
    foreignObject{ overflow: visible !important; }

    /* ===== Header (NotebookLM-like) ===== */
    #hdr{
      position:fixed;
      left:18px;
      top:16px;
      z-index:30;
      pointer-events:none; /* never blocks panning */
    }
    #hdrTitle{
      font-size:22px;
      font-weight:850;
      color:rgba(255,255,255,0.96);
      letter-spacing:-0.2px;
      text-shadow:0 2px 10px rgba(0,0,0,0.35);
      margin:0 0 6px 0;
    }
    #hdrSub{
      font-size:13px;
      font-weight:650;
      color:rgba(255,255,255,0.62);
      margin:0;
    }

    /* ===== Node pills ===== */
    .markmap-foreign{
      display:block !important;
      box-sizing:border-box !important;

      padding:10px 12px;
      border-radius:14px;

      background:rgba(55,65,81,0.82);
      border:1px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.96) !important;

      font-size:16px;
      font-weight:750;
      line-height:1.18;
      text-align:left;

      box-shadow:0 12px 34px rgba(0,0,0,0.28);
      backdrop-filter:blur(7px);

      /* Default (depth>=2): wrap + cap width */
      width:320px;
      max-width:320px;
      white-space:normal !important;
      overflow-wrap:anywhere;
      word-break:break-word;
      hyphens:auto;
    }
    .markmap-foreign *{ color:rgba(255,255,255,0.96) !important; }

    /* Level 0 & 1: match NotebookLM — wide pills, NO wrapping, readable */
    .mm-depth-0, .mm-depth-1{
      width:auto !important;
      max-width:none !important;
      white-space:nowrap !important;

      font-size:17px !important;
      font-weight:800 !important;
      padding:12px 14px !important;
      border-radius:14px !important;
    }

    /* Small “chevron” indicator like NotebookLM for nodes with children */
    .mm-expander{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-left:10px;
      width:20px;
      height:20px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.16);
      background:rgba(0,0,0,0.18);
      color:rgba(255,255,255,0.78);
      font-weight:900;
      font-size:12px;
      flex:0 0 auto;
    }

    /* Optional: hide the default Markmap circle nodes for a cleaner NotebookLM look */
    g.markmap-node circle{ opacity:0.0; }

    /* ===== Controls ===== */
    #uiBar{
      position:fixed;
      right:14px;
      top:14px;
      z-index:40;
      display:flex;
      gap:8px;
      align-items:center;
      padding:10px 10px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.32);
      backdrop-filter:blur(8px);
      user-select:none;
    }
    #uiBar button{
      appearance:none;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.92);
      border-radius:12px;
      padding:9px 10px;
      font:850 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      cursor:pointer;
    }
    #uiBar button:hover{ background:rgba(255,255,255,.10); }
    #uiBar .sep{ width:1px; height:22px; background:rgba(255,255,255,.14); margin:0 2px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view/dist/browser/index.min.js"></script>
</head>

<body>
  <div id="hdr">
    <div id="hdrTitle"></div>
    <div id="hdrSub"></div>
  </div>

  <div id="uiBar">
    <button id="zoomIn" type="button">+</button>
    <button id="zoomOut" type="button">−</button>
    <div class="sep"></div>
    <button id="overview" type="button">Overview</button>
    <button id="readable" type="button">Readable</button>
    <div class="sep"></div>
    <button id="reset" type="button">Reset</button>
  </div>

  <svg id="mm"></svg>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);

      const INIT_LEVEL = Math.max(1, parseInt(params.get("init") || "2", 10));
      const MAX_LEVEL  = Math.max(INIT_LEVEL, parseInt(params.get("max")  || "6", 10));

      // Readability/overview scales (buttons control these)
      const READABLE_SCALE = 1.35;
      const OVERVIEW_SCALE = 0.85;
      const MIN_SCALE = 0.60;
      const MAX_SCALE = 3.00;

      const svg = document.getElementById("mm");
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;
      const transformer = new Transformer();

      const hdrTitleEl = document.getElementById("hdrTitle");
      const hdrSubEl   = document.getElementById("hdrSub");

      let mm = null;
      let initialRoot = null;
      let liveRoot = null;

      function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

      function setHeaderFrom(titleText){
        const title = String(titleText || "").trim();
        hdrTitleEl.textContent = title || "UK VAT Taxonomy";
        const sources = params.get("sources"); // optional
        hdrSubEl.textContent = sources ? ("Based on " + sources + " sources") : "";
      }

      function currentScale(){
        return (mm && mm.state && mm.state.transform && typeof mm.state.transform.k === "number")
          ? mm.state.transform.k
          : 1;
      }

      async function rescaleClamped(k){
        if (!mm) return;
        const kk = Math.max(MIN_SCALE, Math.min(MAX_SCALE, k));
        try { await mm.rescale(kk); } catch(e) {}
      }

      async function setReadable(){ await rescaleClamped(Math.max(currentScale(), READABLE_SCALE)); }
      async function setOverview(){
        try { await mm.fit(1.02); } catch(e) {}
        await rescaleClamped(OVERVIEW_SCALE);
      }

      function collapseBeyond(node, depth, maxDepth){
        if (!node) return;
        node.payload ||= {};
        if (depth >= maxDepth) node.payload.fold = 1;
        if (node.children) node.children.forEach(ch => collapseBeyond(ch, depth+1, maxDepth));
      }

      function rightMostOpen(inode){
        let cur = inode;
        while (cur && cur.children && cur.children.length) {
          const kids = cur.children;
          const last = kids[kids.length - 1];
          if (last && last.data && last.data.payload && last.data.payload.fold === 1) break;
          cur = last;
        }
        return cur || inode;
      }

      async function keepEndVisible(inode){
        if (!mm || !inode) return;
        await setReadable();
        const end = rightMostOpen(inode);
        try { await mm.ensureVisible(end, { left:90, right:200, top:90, bottom:90 }); } catch(e) {}
        decorateNodes();
      }

      function reset(){
        if (!initialRoot || !mm) return;
        liveRoot = deepClone(initialRoot);
        mm.setData(liveRoot);
        setTimeout(async ()=>{
          await setReadable();
          try { await mm.fit(1.02); } catch(e) {}
          await setReadable();
          decorateNodes();
        }, 30);
      }

      // Decorate pills by depth + add NotebookLM-style chevron
      function decorateNodes(){
        svg.querySelectorAll("g.markmap-node").forEach(g=>{
          const inode = g.__data__;
          if (!inode || !inode.data) return;

          const depth = typeof inode.depth === "number" ? inode.depth : 0;
          const pill = g.querySelector(".markmap-foreign");
          if (!pill) return;

          // Depth class for styling
          pill.classList.remove("mm-depth-0","mm-depth-1","mm-depth-2","mm-depth-3","mm-depth-4","mm-depth-5","mm-depth-6");
          pill.classList.add("mm-depth-" + Math.min(depth, 6));

          // Add/remove chevron
          let exp = pill.querySelector(".mm-expander");
          const hasChildren = inode.children && inode.children.length;
          if (hasChildren) {
            if (!exp) {
              exp = document.createElement("span");
              exp.className = "mm-expander";
              pill.appendChild(exp);
            }
            const folded = inode.data.payload && inode.data.payload.fold === 1;
            exp.textContent = folded ? "›" : "‹";
          } else {
            if (exp) exp.remove();
          }

          // Bind click once
          if (g.dataset.vatBound === "1") return;
          g.dataset.vatBound = "1";
          g.style.cursor = "pointer";
          g.addEventListener("click", (e)=>{
            const n = g.__data__;
            if (!n) return;
            setTimeout(()=>keepEndVisible(n), 0);
          });
        });
      }

      async function renderMarkdown(md){
        const clean = String(md || "").trim();
        if (!clean) return;

        const { root } = transformer.transform(clean);

        // Title for header = markdown H1
        setHeaderFrom(root && root.content ? root.content : "");

        collapseBeyond(root, 0, MAX_LEVEL);

        initialRoot = deepClone(root);
        liveRoot = deepClone(root);

        const opts = {
          autoFit:false,
          pan:true,
          zoom:true,
          scrollForPan:true,
          duration:220,

          // More breathing room like NotebookLM
          spacingHorizontal: 160,
          spacingVertical: 120,

          paddingX: 18,
          nodeMinHeight: 26,

          // This maxWidth applies to foreignObject size calculation.
          // Our CSS overrides depth 0/1 to be auto-width.
          maxWidth: 360,

          initialExpandLevel: INIT_LEVEL,

          color: () => "rgba(148,163,184,0.60)",
          lineWidth: () => 1.2,
        };

        if (!mm) {
          mm = Markmap.create(svg, opts, liveRoot);

          document.getElementById("zoomIn").addEventListener("click", () => rescaleClamped(currentScale() * 1.15));
          document.getElementById("zoomOut").addEventListener("click", () => rescaleClamped(currentScale() / 1.15));
          document.getElementById("overview").addEventListener("click", setOverview);
          document.getElementById("readable").addEventListener("click", setReadable);
          document.getElementById("reset").addEventListener("click", reset);

          document.addEventListener("keydown", (e)=>{
            if (e.key === "Escape") reset();
            if (e.key === "+" || e.key === "=") rescaleClamped(currentScale() * 1.15);
            if (e.key === "-" || e.key === "_") rescaleClamped(currentScale() / 1.15);
            if (e.key === "0") setReadable();
          });
        } else {
          mm.setOptions(opts);
          mm.setData(liveRoot);
        }

        // Start readable + centered, then decorate for depth + chevrons
        setTimeout(async ()=>{
          await setReadable();
          try { await mm.fit(1.02); } catch(e) {}
          await setReadable();
          decorateNodes();
        }, 40);
      }

      function extractMarkdown(data){
        if (!data) return "";
        if (typeof data === "string") return data;
        if (typeof data === "object"){
          if (typeof data.markdown === "string") return data.markdown;
          if (typeof data.md === "string") return data.md;
          if (typeof data.text === "string") return data.text;
        }
        return "";
      }

      window.addEventListener("message", (event)=>{
        const d = event.data;
        const type = (d && typeof d === "object" && d.type) ? d.type : "";
        if (type === "VAT_MINDMAP_MD" || type === "MARKDOWN" || type === "MD" || type === "") {
          const md = extractMarkdown(d);
          if (md) renderMarkdown(md);
        }
      });

      // Handshake
      function notifyReady(){
        try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_READY" }, "*"); } catch(e) {}
      }
      window.addEventListener("load", notifyReady);
      notifyReady();
    })();
  </script>
</body>
</html>
