<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    :root { --bg:#0b0f14; --text:#ffffff; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
    }

    #svg { width: 100vw; height: 100vh; display: block; }

    /* Header */
    #header { position: fixed; top: 22px; left: 22px; z-index: 999; pointer-events: none; }
    #title { font-size: 30px; font-weight: 900; margin: 0; color:#fff; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }
    #subtitle { font-size: 14px; margin-top: 6px; color: rgba(255,255,255,0.85); }

    /* Toolbar */
    #toolbar {
      position: fixed; top: 22px; right: 22px;
      z-index: 1000; display: flex; gap: 10px;
      pointer-events: auto;
    }
    .tb-btn {
      background: #1f2937;
      border: 2px solid rgba(255,255,255,0.45);
      color: #fff;
      min-width: 46px; height: 46px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 900;
      font-size: 20px;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      user-select: none;
    }
    .tb-btn.text-btn { font-size: 14px; padding: 0 16px; width: auto; }
    .tb-btn:hover { background:#374151; border-color:#fff; }

    /* Links */
    .markmap-link { stroke: rgba(255,255,255,0.40) !important; stroke-width: 2.5px !important; }

    /* ========= READABILITY + BIGGER BOXES =========
       Markmap may render nodes via:
       - foreignObject (.markmap-foreign)
       - SVG text
       We force BOTH to be big and readable.
    */

    /* foreignObject boxes (this is what gives the rounded “tax boxes”) */
    .markmap-foreign {
      background: #111827 !important;
      border: 2px solid #3b82f6 !important;
      border-radius: 12px !important;

      /* >>> make boxes ~2× taller */
      padding: 20px 26px !important;
      min-height: 64px !important;

      /* text */
      color: #ffffff !important;
      font-weight: 900 !important;
      font-size: 22px !important;
      line-height: 1.15 !important;

      /* layout */
      display: inline-flex !important;
      align-items: center !important;
      white-space: nowrap !important;

      box-shadow: 0 10px 26px rgba(0,0,0,0.70) !important;
      overflow: visible !important;
    }
    .markmap-foreign div {
      color: #ffffff !important;
      background: transparent !important;
    }

    /* If markmap renders SVG text, force it readable too */
    .markmap text,
    .markmap .markmap-node text {
      fill: #ffffff !important;
      font-size: 22px !important;
      font-weight: 900 !important;

      /* outline so it never “disappears” */
      paint-order: stroke !important;
      stroke: rgba(0,0,0,0.95) !important;
      stroke-width: 6px !important;
      stroke-linejoin: round !important;
    }

    /* foreignObject inner text safety net */
    .markmap foreignObject,
    .markmap foreignObject * {
      color: #ffffff !important;
      font-size: 22px !important;
      font-weight: 900 !important;
      line-height: 1.15 !important;
    }
  </style>
</head>

<body>
  <div id="header">
    <div id="title">Taxonomy: Animals, Food, and Catering</div>
    <div id="subtitle" id="lvl">Expand level: 2 (click a node to magnify)</div>
  </div>

  <div id="toolbar">
    <button class="tb-btn" id="plus"  type="button" title="Show one more level">+</button>
    <button class="tb-btn" id="minus" type="button" title="Hide one level">−</button>
    <button class="tb-btn text-btn" id="fit"  type="button" title="Reset view">Resize</button>
    <button class="tb-btn text-btn" id="close" type="button" title="Close">Close</button>
  </div>

  <svg id="svg" class="markmap"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function () {
      const { Transformer, Markmap } = window.markmap;
      const svg = document.querySelector('#svg');
      const transformer = new Transformer();

      let mm = null;
      let baseRoot = null;
      let expandLevel = 2;

      function clone(obj) {
        if (typeof structuredClone === 'function') return structuredClone(obj);
        return JSON.parse(JSON.stringify(obj));
      }

      function applyFoldByDepth(node, depth, maxDepth) {
        if (!node) return;
        if (!node.payload) node.payload = {};
        if (!node.children || !node.children.length) return;

        if (depth >= maxDepth) {
          node.payload.fold = 1;
        } else {
          node.payload.fold = 0;
          for (const child of node.children) applyFoldByDepth(child, depth + 1, maxDepth);
        }
      }

      function render() {
        if (!baseRoot) return;

        const root = clone(baseRoot);
        applyFoldByDepth(root, 0, expandLevel);

        if (!mm) {
          mm = Markmap.create(svg, {
            autoFit: true,
            spacingVertical: 70,
            spacingHorizontal: 180,
          }, root);
          wireNodeMagnify();
        } else {
          mm.setData(root);
          resetView(true); // after changing fold levels, reset neatly
          wireNodeMagnify();
        }

        const lvl = document.getElementById('lvl');
        if (lvl) lvl.textContent = 'Expand level: ' + expandLevel + ' (click a node to magnify)';
      }

      /* === TRUE RESET (fixes your Resize button) ===
         1) cancel any active zoom transitions
         2) reset zoom transform
         3) then fit the whole map
      */
      function resetView(skipInterrupt) {
        if (!mm) return;

        const sel = d3.select(svg);
        try { if (!skipInterrupt) sel.interrupt(); } catch (e) {}

        // Hard reset zoom/pan first
        try {
          if (mm.zoom && mm.zoom.transform) {
            sel.call(mm.zoom.transform, d3.zoomIdentity);
          }
        } catch (e) {}

        // Then fit to screen
        setTimeout(() => {
          try { mm.fit && mm.fit(); } catch (e) {}
        }, 0);
      }

      /* === Magnify clicked node === */
      function zoomToNodeElement(nodeEl, strength) {
        if (!mm || !mm.zoom) return;

        const svgRect = svg.getBoundingClientRect();
        const nodeRect = nodeEl.getBoundingClientRect();

        const cx = (nodeRect.left + nodeRect.right) / 2 - svgRect.left;
        const cy = (nodeRect.top + nodeRect.bottom) / 2 - svgRect.top;

        const t = d3.zoomTransform(svg);
        const p = t.invert([cx, cy]);

        const k2 = Math.max(1, Math.min(6, t.k * strength));
        const x2 = (svgRect.width  / 2) - (p[0] * k2);
        const y2 = (svgRect.height / 2) - (p[1] * k2);

        const tr = d3.zoomIdentity.translate(x2, y2).scale(k2);

        d3.select(svg)
          .interrupt()
          .transition()
          .duration(220)
          .call(mm.zoom.transform, tr);
      }

      function wireNodeMagnify() {
        const groups = d3.select(svg).selectAll('g');
        groups.style('cursor', function () {
          const hasText = this.querySelector('text') || this.querySelector('foreignObject');
          return hasText ? 'pointer' : null;
        });

        groups.on('click.vatFocus', null);
        groups.on('click.vatFocus', function(event) {
          const isNode = this.querySelector('text') || this.querySelector('foreignObject');
          if (!isNode) return;

          event.preventDefault();
          event.stopPropagation();

          // stronger zoom once you're looking deeper
          const strength = (expandLevel >= 4) ? 2.1 : 1.6;
          zoomToNodeElement(this, strength);
        });
      }

      function safe(fn){
        return function(e){
          e.preventDefault(); e.stopPropagation();
          fn();
        };
      }

      document.getElementById('plus').addEventListener('click', safe(() => {
        expandLevel = Math.min(10, expandLevel + 1);
        render();
      }), true);

      document.getElementById('minus').addEventListener('click', safe(() => {
        expandLevel = Math.max(1, expandLevel - 1);
        render();
      }), true);

      // Resize should always reset to the “original screen”
      document.getElementById('fit').addEventListener('click', safe(() => {
        resetView();
      }), true);

      document.getElementById('close').addEventListener('click', safe(() => {
        window.parent.postMessage({ type: 'VAT_CLOSE' }, '*');
      }), true);

      // Background click => reset view (very useful after magnify)
      svg.addEventListener('click', () => resetView(), { passive: true });

      // Receive markdown from Squarespace
      window.addEventListener('message', (ev) => {
        if (!ev.data || ev.data.type !== 'VAT_SET') return;

        expandLevel = Number(ev.data.expandLevel || 2);
        if (!Number.isFinite(expandLevel)) expandLevel = 2;
        expandLevel = Math.max(1, Math.min(10, expandLevel));

        const { root } = transformer.transform(String(ev.data.markdown || ''));
        baseRoot = root;

        // First render then fit (ensures Resize works from the start)
        render();
        setTimeout(() => resetView(), 50);
      });

      window.parent.postMessage({ type: 'VAT_READY' }, '*');
    })();
  </script>
</body>
</html>
