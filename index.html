<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    html, body { height:100%; margin:0; }
    body{ background:#0b0f16; overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    #mm{ width:100vw; height:100vh; display:block; background:#0b0f16; }
    .markmap-link{ opacity:0.40; }
    foreignObject{ overflow:visible !important; }

    #hdr{ position:fixed; left:18px; top:16px; z-index:30; pointer-events:none; }
    #hdrTitle{ font-size:22px; font-weight:850; color:rgba(255,255,255,.96); margin:0 0 6px 0; }
    #hdrSub{ font-size:13px; font-weight:650; color:rgba(255,255,255,.62); margin:0; }

    #uiBar{
      position:fixed; right:14px; top:14px; z-index:40;
      display:flex; gap:8px; align-items:center;
      padding:10px; border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.32);
      backdrop-filter:blur(8px);
      user-select:none;
    }
    #uiBar button{
      appearance:none;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.92);
      border-radius:12px;
      padding:9px 10px;
      font:850 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      cursor:pointer;
    }
    #uiBar button:hover{ background:rgba(255,255,255,.10); }
    #uiBar .sep{ width:1px; height:22px; background:rgba(255,255,255,.14); margin:0 2px; }

    .markmap-foreign{
      display:flex !important; align-items:center; gap:10px;
      box-sizing:border-box !important;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(55,65,81,0.82);
      border:1px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.96) !important;
      font-size:16px; font-weight:800; line-height:1.18;
      text-align:left;
      box-shadow:0 12px 34px rgba(0,0,0,0.28);
      backdrop-filter:blur(7px);
      width:340px; max-width:340px;
      white-space:normal !important;
      overflow-wrap:anywhere; word-break:break-word; hyphens:auto;
      cursor:pointer;
    }
    .markmap-foreign *{ color:rgba(255,255,255,0.96) !important; }

    .mm-depth-0, .mm-depth-1{
      width:auto !important; max-width:none !important;
      white-space:nowrap !important;
      font-size:17px !important; font-weight:850 !important;
      padding:12px 14px !important;
    }

    .mm-expander{
      display:inline-flex; align-items:center; justify-content:center;
      width:22px; height:22px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(0,0,0,0.20);
      color:rgba(255,255,255,0.88);
      font-weight:950; font-size:14px;
      flex:0 0 auto;
      cursor:pointer;
      user-select:none;
    }
    .mm-expander.mm-disabled{ opacity:0.35; cursor:default; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view/dist/browser/index.min.js"></script>
</head>

<body>
  <div id="hdr">
    <div id="hdrTitle"></div>
    <div id="hdrSub"></div>
  </div>

  <div id="uiBar">
    <button id="zoomIn" type="button">+</button>
    <button id="zoomOut" type="button">−</button>
    <div class="sep"></div>
    <button id="overview" type="button">Overview</button>
    <button id="readable" type="button">Readable</button>
    <div class="sep"></div>
    <button id="reset" type="button">Reset</button>
  </div>

  <svg id="mm"></svg>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const INIT_LEVEL = Math.max(1, parseInt(params.get("init") || "2", 10));
      const MAX_LEVEL  = Math.max(INIT_LEVEL, parseInt(params.get("max") || "6", 10));

      const svg = document.getElementById("mm");
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;
      const transformer = new Transformer();

      const hdrTitleEl = document.getElementById("hdrTitle");
      const hdrSubEl   = document.getElementById("hdrSub");

      let mm = null;
      let initialRoot = null;
      let liveRoot = null;

      let lastHash = "";
      let lastLen = 0;

      function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

      function hashStr(s){
        let h = 0;
        for (let i=0; i<s.length; i++){
          h = ((h << 5) - h) + s.charCodeAt(i);
          h |= 0;
        }
        return String(h);
      }

      function decodeHtmlEntities(str){
        const t = document.createElement("textarea");
        t.innerHTML = String(str || "");
        return t.value;
      }

      function setHeaderFrom(titleText){
        hdrTitleEl.textContent = decodeHtmlEntities(titleText || "").trim() || "UK VAT Taxonomy";
        const sources = params.get("sources");
        hdrSubEl.textContent = sources ? ("Based on " + sources + " sources") : "";
      }

      function foldFrom(node, depth, showDepth){
        if (!node) return;
        node.payload ||= {};
        if (depth >= showDepth - 1 && node.children && node.children.length) node.payload.fold = 1;
        if (node.children) node.children.forEach(ch => foldFrom(ch, depth+1, showDepth));
      }

      function collapseBeyond(node, depth, maxDepth){
        if (!node) return;
        node.payload ||= {};
        if (depth >= maxDepth) node.payload.fold = 1;
        if (node.children) node.children.forEach(ch => collapseBeyond(ch, depth+1, maxDepth));
      }

      function currentZoom(){
        try { return d3.zoomTransform(svg).k || 1; } catch(e) { return 1; }
      }

      async function fitClamped(maxZoom){
        if (!mm) return;
        try { await mm.fit(1.02); } catch(e) {}
        try {
          const k = currentZoom();
          if (k > maxZoom) await mm.rescale(maxZoom);
        } catch(e) {}
      }

      function decorateAndBind(){
        svg.querySelectorAll("g.markmap-node").forEach(g=>{
          const inode = g.__data__;
          if (!inode || !inode.data) return;

          const depth = typeof inode.depth === "number" ? inode.depth : 0;
          const pill = g.querySelector(".markmap-foreign");
          if (!pill) return;

          pill.classList.remove("mm-depth-0","mm-depth-1","mm-depth-2","mm-depth-3","mm-depth-4","mm-depth-5","mm-depth-6");
          pill.classList.add("mm-depth-" + Math.min(depth, 6));

          const hasChildren = inode.data.children && inode.data.children.length;

          let exp = pill.querySelector(".mm-expander");
          if (!exp) {
            exp = document.createElement("span");
            exp.className = "mm-expander";
            pill.appendChild(exp);
          }

          if (hasChildren) {
            exp.classList.remove("mm-disabled");
            const folded = inode.data.payload && inode.data.payload.fold === 1;
            exp.textContent = folded ? "+" : "−";
          } else {
            exp.classList.add("mm-disabled");
            exp.textContent = "•";
          }

          if (pill.dataset.vatBound === "1") return;
          pill.dataset.vatBound = "1";

          function toggle(){
            if (!hasChildren) return;
            inode.data.payload ||= {};
            inode.data.payload.fold = (inode.data.payload.fold === 1) ? 0 : 1;

            mm.setData(liveRoot);

            setTimeout(async ()=>{
              decorateAndBind();
              // Allow more zoom when deeper expands, but prevent huge zoom when shallow
              await fitClamped(1.10);
              decorateAndBind();
            }, 35);
          }

          exp.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); if (!hasChildren) return; toggle(); });
          pill.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); if (!hasChildren) return; toggle(); });
        });
      }

      async function renderMarkdown(md){
        const clean = String(md || "").trim();
        if (!clean) return;

        const { root } = transformer.transform(clean);
        setHeaderFrom(root && root.content ? root.content : "");

        foldFrom(root, 0, INIT_LEVEL);
        collapseBeyond(root, 0, MAX_LEVEL);

        initialRoot = deepClone(root);
        liveRoot = deepClone(root);

        const opts = {
          autoFit:false,
          pan:true,
          zoom:true,
          scrollForPan:true,
          duration:160,
          spacingHorizontal: 210,
          spacingVertical: 140,
          paddingX: 18,
          nodeMinHeight: 26,
          maxWidth: 560,
          initialExpandLevel: INIT_LEVEL,
          color: () => "rgba(148,163,184,0.60)",
          lineWidth: () => 1.2
        };

        if (!mm) {
          mm = Markmap.create(svg, opts, liveRoot);

          document.getElementById("zoomIn").addEventListener("click", async ()=>{
            const k = currentZoom();
            try { await mm.rescale(k * 1.15); } catch(e) {}
          });
          document.getElementById("zoomOut").addEventListener("click", async ()=>{
            const k = currentZoom();
            try { await mm.rescale(Math.max(0.2, k / 1.15)); } catch(e) {}
          });

          document.getElementById("overview").addEventListener("click", async ()=>{ await fitClamped(1.10); });

          document.getElementById("readable").addEventListener("click", async ()=>{
            const k = currentZoom();
            try { await mm.rescale(Math.max(k, 1.15)); } catch(e) {}
          });

          document.getElementById("reset").addEventListener("click", async ()=>{
            liveRoot = deepClone(initialRoot);
            mm.setData(liveRoot);
            setTimeout(async ()=>{
              decorateAndBind();
              await fitClamped(1.10);
              decorateAndBind();
            }, 35);
          });
        } else {
          mm.setOptions(opts);
          mm.setData(liveRoot);
        }

        setTimeout(async ()=>{
          decorateAndBind();
          // IMPORTANT: clamp prevents giant zoom when only 2 nodes visible
          await fitClamped(1.10);
          decorateAndBind();

          // Tell parent we are loaded (stops retry logic)
          try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_ACK" }, "*"); } catch(e) {}
        }, 60);
      }

      function extractMarkdown(data){
        if (!data) return "";
        if (typeof data === "string") return data;
        if (typeof data === "object"){
          if (typeof data.markdown === "string") return data.markdown;
          if (typeof data.md === "string") return data.md;
          if (typeof data.text === "string") return data.text;
        }
        return "";
      }

      window.addEventListener("message", (event)=>{
        const d = event.data || {};
        const type = d.type || "";

        if (type === "VAT_MINDMAP_MD" || type === "MARKDOWN" || type === "MD" || type === "") {
          const md = extractMarkdown(d);
          if (!md) return;

          const h = hashStr(md);
          if (h === lastHash && md.length === lastLen) {
            // Duplicate: just ACK (prevents shudder)
            try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_ACK" }, "*"); } catch(e) {}
            return;
          }
          lastHash = h;
          lastLen = md.length;

          renderMarkdown(md);
        }

        if (type === "FIT") fitClamped(1.10);
      });

      // Handshake: tell parent we are ready (so parent posts ONCE)
      try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_READY" }, "*"); } catch(e) {}
    })();
  </script>
</body>
</html>
