<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    html, body { height:100%; margin:0; }
    body{
      background:#0b0f16;
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    #mm{ width:100vw; height:100vh; display:block; background:#0b0f16; }

    g.markmap-node, g.markmap-node foreignObject, .markmap-foreign { pointer-events:auto !important; }
    .markmap-link{ opacity:0.40; }
    foreignObject{ overflow:visible !important; }

    /* Header (NotebookLM-like) */
    #hdr{
      position:fixed; left:18px; top:16px;
      z-index:30; pointer-events:none;
    }
    #hdrTitle{ font-size:22px; font-weight:850; color:rgba(255,255,255,.96); margin:0 0 6px 0; }
    #hdrSub{ font-size:13px; font-weight:650; color:rgba(255,255,255,.62); margin:0; }

    /* Toolbar */
    #uiBar{
      position:fixed; right:14px; top:14px; z-index:40;
      display:flex; gap:8px; align-items:center;
      padding:10px; border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.32);
      backdrop-filter:blur(8px);
      user-select:none;
    }
    #uiBar button{
      appearance:none;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.92);
      border-radius:12px;
      padding:9px 10px;
      font:850 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      cursor:pointer;
      white-space:nowrap;
    }
    #uiBar button:hover{ background:rgba(255,255,255,.10); }
    #uiBar .sep{ width:1px; height:22px; background:rgba(255,255,255,.14); margin:0 2px; }

    /* Node pills */
    .markmap-foreign{
      display:flex !important;
      align-items:center;
      gap:10px;
      box-sizing:border-box !important;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(55,65,81,0.82);
      border:1px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.96) !important;
      font-size:15px;
      font-weight:800;
      line-height:1.18;
      text-align:left;
      box-shadow:0 12px 34px rgba(0,0,0,0.28);
      backdrop-filter:blur(7px);
      width:340px; max-width:340px;
      white-space:normal !important;
      overflow-wrap:anywhere;
      word-break:break-word;
      hyphens:auto;
      cursor:pointer;
    }
    .markmap-foreign *{ color:rgba(255,255,255,0.96) !important; }

    .mm-depth-0{
      width:420px !important; max-width:420px !important;
      font-size:16px !important; font-weight:900 !important;
      padding:12px 14px !important;
    }

    /* Expander button */
    .mm-expander{
      display:inline-flex; align-items:center; justify-content:center;
      width:26px; height:26px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.22);
      background:rgba(0,0,0,0.24);
      color:rgba(255,255,255,0.92);
      font-weight:950; font-size:15px;
      flex:0 0 auto;
      user-select:none;
    }
    .mm-expander.mm-disabled{ opacity:0.30; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view/dist/browser/index.min.js"></script>
</head>

<body>
  <div id="hdr">
    <div id="hdrTitle"></div>
    <div id="hdrSub"></div>
  </div>

  <div id="uiBar">
    <button id="zoomIn" type="button">+</button>
    <button id="zoomOut" type="button">−</button>
    <div class="sep"></div>
    <button id="overview" type="button">Overview</button>
    <button id="readable" type="button">Readable</button>
    <div class="sep"></div>
    <button id="reset" type="button">Reset</button>
    <button id="closeBtn" type="button">Close</button>
  </div>

  <svg id="mm"></svg>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);

      // YOU WANT: open at level 2 only
      const INIT_LEVEL = Math.max(1, parseInt(params.get("init") || "2", 10));
      const MAX_LEVEL  = Math.max(INIT_LEVEL, parseInt(params.get("max") || "10", 10));

      const svg = document.getElementById("mm");
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;

      const transformer = new Transformer();
      const hdrTitleEl = document.getElementById("hdrTitle");
      const hdrSubEl   = document.getElementById("hdrSub");

      let mm = null;
      let initialData = null;

      function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
      function ensurePayload(n){ if (!n.payload || typeof n.payload !== "object") n.payload = {}; return n.payload; }
      function hasChildren(n){ return !!(n && Array.isArray(n.children) && n.children.length); }

      function decodeHtmlEntities(str){
        const t = document.createElement("textarea");
        t.innerHTML = String(str || "");
        return t.value;
      }

      function setHeaderFrom(titleText){
        hdrTitleEl.textContent = decodeHtmlEntities(titleText || "").trim() || "UK VAT Taxonomy";
        const sources = params.get("sources");
        hdrSubEl.textContent = sources ? ("Based on " + sources + " sources") : "";
      }

      // KEY: fold using Markmap payload (keeps children, allows expand/collapse at every node)
      function setFold(n, fold){
        const p = ensurePayload(n);
        p.fold = fold ? 1 : 0;
      }

      // Open at 2 levels: fold every node that is at depth >= (INIT_LEVEL - 1)
      // Example: INIT_LEVEL=2 => fold nodes at depth >=1 (i.e., Level 2 nodes start with "+" if they have children)
      function applyInitialFolding(n, depth){
        ensurePayload(n);

        if (depth >= INIT_LEVEL - 1) setFold(n, true);
        else setFold(n, false);

        (n.children || []).forEach(ch => applyInitialFolding(ch, depth + 1));
      }

      // Optional safety: prevent showing beyond MAX_LEVEL (fold from boundary)
      function capMaxDepth(n, depth){
        ensurePayload(n);
        if (depth >= MAX_LEVEL - 1) setFold(n, true);
        (n.children || []).forEach(ch => capMaxDepth(ch, depth + 1));
      }

      async function fitClamped(maxK){
        if (!mm) return;
        try { await mm.fit(1.02); } catch(e) {}
        try{
          const k = (mm.state && mm.state.transform && mm.state.transform.k) ? mm.state.transform.k : 1;
          if (k > maxK) await mm.rescale(maxK / k);
        }catch(e){}
      }

      function toggleFold(d){
        if (!d || !hasChildren(d)) return;
        const p = ensurePayload(d);
        p.fold = (p.fold === 1) ? 0 : 1;
        mm.setData(mm.state.data);
        setTimeout(()=>decorate(), 40);
      }

      function decorate(){
        svg.querySelectorAll("g.markmap-node").forEach(g=>{
          const inode = g.__data__;
          if (!inode || !inode.data) return;

          const d = inode.data;
          const depth = typeof inode.depth === "number" ? inode.depth : 0;

          const pill = g.querySelector(".markmap-foreign");
          if (!pill) return;

          pill.classList.remove("mm-depth-0","mm-depth-1","mm-depth-2","mm-depth-3","mm-depth-4","mm-depth-5","mm-depth-6");
          pill.classList.add("mm-depth-" + Math.min(depth, 6));

          let exp = pill.querySelector(".mm-expander");
          if (!exp) {
            exp = document.createElement("span");
            exp.className = "mm-expander";
            pill.prepend(exp);
          }

          const kids = hasChildren(d);
          const folded = (d.payload && d.payload.fold === 1);

          if (!kids){
            exp.classList.add("mm-disabled");
            exp.textContent = "•";
          } else {
            exp.classList.remove("mm-disabled");
            exp.textContent = folded ? "+" : "−";
          }

          if (pill.dataset.vatBound === "1") return;
          pill.dataset.vatBound = "1";

          exp.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); toggleFold(d); });
          pill.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); toggleFold(d); });
        });
      }

      async function renderMarkdown(md){
        const clean = String(md || "").trim();
        if (!clean) return;

        const { root } = transformer.transform(clean);
        setHeaderFrom(root && root.content ? root.content : "");

        // OPEN AT LEVEL 2 ONLY + expand/collapse stepwise from there
        applyInitialFolding(root, 0);
        capMaxDepth(root, 0);

        initialData = deepClone(root);

        const opts = {
          autoFit:false,
          pan:true,
          zoom:true,
          scrollForPan:true,
          duration:0,
          spacingHorizontal: 240,
          spacingVertical: 160,
          paddingX: 18,
          nodeMinHeight: 26,
          maxWidth: 650,
          color: () => "rgba(148,163,184,0.60)",
          lineWidth: () => 1.2
        };

        if (!mm) {
          mm = Markmap.create(svg, opts, root);

          // Zoom buttons (multiplier)
          document.getElementById("zoomIn").addEventListener("click", async ()=>{ try{ await mm.rescale(1.15); }catch(e){} });
          document.getElementById("zoomOut").addEventListener("click", async ()=>{ try{ await mm.rescale(1/1.15); }catch(e){} });

          document.getElementById("overview").addEventListener("click", async ()=>{ await fitClamped(1.05); });
          document.getElementById("readable").addEventListener("click", async ()=>{ try{ await mm.rescale(1.25); }catch(e){} });

          document.getElementById("reset").addEventListener("click", async ()=>{
            mm.setData(deepClone(initialData));
            setTimeout(async ()=>{ decorate(); await fitClamped(1.05); decorate(); }, 40);
          });

          document.getElementById("closeBtn").addEventListener("click", ()=>{
            try { window.parent && window.parent.postMessage({ type:"VAT_CLOSE" }, "*"); } catch(e) {}
          });

        } else {
          mm.setOptions(opts);
          mm.setData(root);
        }

        setTimeout(async ()=>{
          decorate();
          await fitClamped(1.05);
          decorate();
          try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_ACK" }, "*"); } catch(e) {}
        }, 70);
      }

      function extractMarkdown(data){
        if (!data) return "";
        if (typeof data === "string") return data;
        if (typeof data === "object"){
          if (typeof data.markdown === "string") return data.markdown;
          if (typeof data.md === "string") return data.md;
          if (typeof data.text === "string") return data.text;
        }
        return "";
      }

      window.addEventListener("message", (event)=>{
        const d = event.data || {};
        if (d.type === "VAT_MINDMAP_MD" || d.type === "MARKDOWN" || d.type === "MD" || !d.type) {
          const md = extractMarkdown(d);
          if (md) renderMarkdown(md);
        }
      });

      try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_READY" }, "*"); } catch(e) {}
    })();
  </script>
</body>
</html>
