<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VAT Mindmap Viewer</title>

  <style>
    html, body { height:100%; margin:0; }
    body{ background:#0b0f16; overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    #mm{ width:100vw; height:100vh; display:block; background:#0b0f16; }
    .markmap-link{ opacity:0.40; }
    foreignObject{ overflow:visible !important; }

    /* Header */
    #hdr{ position:fixed; left:18px; top:16px; z-index:30; pointer-events:none; }
    #hdrTitle{ font-size:22px; font-weight:850; color:rgba(255,255,255,0.96); margin:0 0 6px 0; }
    #hdrSub{ font-size:13px; font-weight:650; color:rgba(255,255,255,0.62); margin:0; }

    /* Pills */
    .markmap-foreign{
      display:flex !important; align-items:center; gap:10px;
      padding:10px 12px; border-radius:14px;
      background:rgba(55,65,81,0.82);
      border:1px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.96) !important;
      font-size:16px; font-weight:800; line-height:1.18;
      box-shadow:0 12px 34px rgba(0,0,0,0.28);
      backdrop-filter:blur(7px);

      /* default (depth>=2): wrap */
      width:340px; max-width:340px;
      white-space:normal !important;
      overflow-wrap:anywhere; word-break:break-word; hyphens:auto;
    }
    .markmap-foreign *{ color:rgba(255,255,255,0.96) !important; }

    /* depth 0/1: wide, no-wrap */
    .mm-depth-0, .mm-depth-1{
      width:auto !important; max-width:none !important;
      white-space:nowrap !important;
      font-size:17px !important; font-weight:850 !important;
      padding:12px 14px !important;
    }

    /* Chevron */
    .mm-expander{
      display:inline-flex; align-items:center; justify-content:center;
      width:20px; height:20px; border-radius:999px;
      border:1px solid rgba(255,255,255,0.16);
      background:rgba(0,0,0,0.18);
      color:rgba(255,255,255,0.78);
      font-weight:900; font-size:12px;
      cursor:pointer;
      pointer-events:auto;
      flex:0 0 auto;
    }

    /* Controls */
    #uiBar{
      position:fixed; right:14px; top:14px; z-index:40;
      display:flex; gap:8px; align-items:center;
      padding:10px; border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.32);
      backdrop-filter:blur(8px);
      user-select:none;
    }
    #uiBar button{
      appearance:none;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.92);
      border-radius:12px;
      padding:9px 10px;
      font:850 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      cursor:pointer;
    }
    #uiBar button:hover{ background:rgba(255,255,255,.10); }
    #uiBar .sep{ width:1px; height:22px; background:rgba(255,255,255,.14); margin:0 2px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view/dist/browser/index.min.js"></script>
</head>

<body>
  <div id="hdr">
    <div id="hdrTitle"></div>
    <div id="hdrSub"></div>
  </div>

  <div id="uiBar">
    <button id="zoomIn" type="button">+</button>
    <button id="zoomOut" type="button">−</button>
    <div class="sep"></div>
    <button id="overview" type="button">Overview</button>
    <button id="readable" type="button">Readable</button>
    <div class="sep"></div>
    <button id="reset" type="button">Reset</button>
  </div>

  <svg id="mm"></svg>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const INIT_LEVEL = Math.max(1, parseInt(params.get("init") || "4", 10));
      const MAX_LEVEL  = Math.max(INIT_LEVEL, parseInt(params.get("max") || "6", 10));

      const svg = document.getElementById("mm");
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;
      const transformer = new Transformer();

      const hdrTitleEl = document.getElementById("hdrTitle");
      const hdrSubEl   = document.getElementById("hdrSub");

      let mm = null;
      let initialRoot = null;
      let liveRoot = null;

      function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

      function decodeHtmlEntities(str){
        const t = document.createElement("textarea");
        t.innerHTML = String(str || "");
        return t.value;
      }

      function setHeaderFrom(titleText){
        hdrTitleEl.textContent = decodeHtmlEntities(titleText || "").trim() || "UK VAT Taxonomy";
        const sources = params.get("sources");
        hdrSubEl.textContent = sources ? ("Based on " + sources + " sources") : "";
      }

      function collapseBeyond(node, depth, maxDepth){
        if (!node) return;
        node.payload ||= {};
        if (depth >= maxDepth) node.payload.fold = 1;
        if (node.children) node.children.forEach(ch => collapseBeyond(ch, depth+1, maxDepth));
      }

      function decorateNodes(){
        svg.querySelectorAll("g.markmap-node").forEach(g=>{
          const inode = g.__data__;
          if (!inode || !inode.data) return;

          const depth = typeof inode.depth === "number" ? inode.depth : 0;
          const pill = g.querySelector(".markmap-foreign");
          if (!pill) return;

          pill.classList.remove("mm-depth-0","mm-depth-1","mm-depth-2","mm-depth-3","mm-depth-4","mm-depth-5","mm-depth-6");
          pill.classList.add("mm-depth-" + Math.min(depth, 6));

          const hasChildren = inode.data.children && inode.data.children.length;

          // Expander
          let exp = pill.querySelector(".mm-expander");
          if (hasChildren) {
            if (!exp) {
              exp = document.createElement("span");
              exp.className = "mm-expander";
              pill.appendChild(exp);
            }
            const folded = inode.data.payload && inode.data.payload.fold === 1;
            exp.textContent = folded ? "›" : "‹";
          } else {
            if (exp) exp.remove();
          }
        });
      }

      // REAL toggle: edit payload.fold and re-render
      function toggleNode(inode){
        const d = inode && inode.data;
        if (!d || !d.children || !d.children.length) return;

        d.payload ||= {};
        d.payload.fold = (d.payload.fold === 1) ? 0 : 1;

        // re-render; markmap keeps current transform well enough in practice
        mm.setData(liveRoot);
        setTimeout(decorateNodes, 30);
      }

      function bindToggleClicks(){
        // One delegated handler; works for foreignObject content too
        svg.addEventListener("click", (e)=>{
          const g = e.target && e.target.closest ? e.target.closest("g.markmap-node") : null;
          if (!g || !g.__data__) return;

          const inode = g.__data__;
          const hasChildren = inode.data && inode.data.children && inode.data.children.length;
          if (!hasChildren) return;

          // click on chevron OR pill toggles
          const isExpander = e.target && e.target.classList && e.target.classList.contains("mm-expander");
          const isPill = e.target && (e.target.classList && e.target.classList.contains("markmap-foreign") || e.target.closest(".markmap-foreign"));
          if (isExpander || isPill) {
            e.preventDefault();
            e.stopPropagation();
            toggleNode(inode);
          }
        }, true);
      }

      async function renderMarkdown(md){
        const clean = String(md || "").trim();
        if (!clean) return;

        const { root } = transformer.transform(clean);
        setHeaderFrom(root && root.content ? root.content : "");

        collapseBeyond(root, 0, MAX_LEVEL);

        initialRoot = deepClone(root);
        liveRoot = deepClone(root);

        const opts = {
          autoFit:false,
          pan:true,
          zoom:true,
          scrollForPan:true,
          duration:220,

          // These two are what make level-3 feel more "stacked/vertical"
          spacingHorizontal: 150,
          spacingVertical: 160,

          paddingX: 18,
          nodeMinHeight: 26,
          maxWidth: 560,

          initialExpandLevel: INIT_LEVEL,

          color: () => "rgba(148,163,184,0.60)",
          lineWidth: () => 1.2,
        };

        if (!mm) {
          mm = Markmap.create(svg, opts, liveRoot);
          bindToggleClicks();

          document.getElementById("zoomIn").addEventListener("click", () => mm.rescale(mm.state.transform.k * 1.15));
          document.getElementById("zoomOut").addEventListener("click", () => mm.rescale(mm.state.transform.k / 1.15));
          document.getElementById("overview").addEventListener("click", async ()=>{ try{ await mm.fit(1.02); }catch(e){} });
          document.getElementById("readable").addEventListener("click", () => mm.rescale(Math.max(mm.state.transform.k, 1.25)));
          document.getElementById("reset").addEventListener("click", ()=>{
            liveRoot = deepClone(initialRoot);
            mm.setData(liveRoot);
            setTimeout(decorateNodes, 30);
          });
        } else {
          mm.setOptions(opts);
          mm.setData(liveRoot);
        }

        setTimeout(async ()=>{
          try { await mm.fit(1.02); } catch(e) {}
          try { await mm.rescale(Math.max(mm.state.transform.k, 1.25)); } catch(e) {}
          decorateNodes();
        }, 60);
      }

      function extractMarkdown(data){
        if (!data) return "";
        if (typeof data === "string") return data;
        if (typeof data === "object"){
          if (typeof data.markdown === "string") return data.markdown;
          if (typeof data.md === "string") return data.md;
          if (typeof data.text === "string") return data.text;
        }
        return "";
      }

      window.addEventListener("message", (event)=>{
        const d = event.data;
        const type = (d && typeof d === "object" && d.type) ? d.type : "";
        if (type === "VAT_MINDMAP_MD" || type === "MARKDOWN" || type === "MD" || type === "") {
          const md = extractMarkdown(d);
          if (md) renderMarkdown(md);
        }
      });

      // READY ping for Squarespace
      try { window.parent && window.parent.postMessage({ type:"VAT_MINDMAP_READY" }, "*"); } catch(e) {}
    })();
  </script>
</body>
</html>
