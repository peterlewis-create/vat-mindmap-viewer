<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAT Mindmap Viewer</title>
  <style>
    :root{
      --bg:#323437;        /* LLM-like charcoal */
      --text:#ffffff;
      --muted:rgba(255,255,255,.75);
      --nodeGrey:#3f4956;  /* level 0–2 */
      --nodeGreen:#1f4a35; /* deeper levels */
      --nodeBorder:rgba(255,255,255,.10);
      --link:rgba(140,155,170,.35);
      --accent:#79a8ff;
    }

    html,body{
      height:100%; margin:0; background:var(--bg); overflow:hidden;
      font-family:system-ui,-apple-system,sans-serif; color:var(--text);
    }

    #svg{ width:100vw; height:100vh; display:block; background:var(--bg); }

    #header{ position:fixed; top:18px; left:18px; z-index:50; pointer-events:none; }
    #title{ font-size:34px; font-weight:900; margin:0; line-height:1.05; }
    #subtitle{ margin-top:6px; font-size:13px; color:var(--muted); font-weight:700; }

    #toolbar{ position:fixed; top:18px; right:18px; z-index:60; display:flex; gap:10px; }
    .tb-btn{
      background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.25); color:#fff;
      height:40px; min-width:40px; border-radius:10px; font-weight:900; cursor:pointer;
      display:flex; align-items:center; justify-content:center; padding:0 10px;
    }
    .tb-btn.text{ min-width:auto; font-size:13px; }
    .tb-btn:hover{ border-color:rgba(255,255,255,.55); }

    .markmap-link{ stroke:var(--link) !important; stroke-width:2.2px !important; }

    .markmap-foreign{
      border-radius:8px !important; padding:7px 10px !important; font-size:14px !important;
      font-weight:800 !important; line-height:1.25 !important; color:#fff !important;
      border:1px solid var(--nodeBorder) !important; white-space:nowrap !important;
      max-width:420px !important; overflow:visible !important;
    }

    g.markmap-node[data-depth="0"] .markmap-foreign,
    g.markmap-node[data-depth="1"] .markmap-foreign,
    g.markmap-node[data-depth="2"] .markmap-foreign{ background:var(--nodeGrey) !important; }
    g.markmap-node[data-depth="3"] .markmap-foreign,
    g.markmap-node[data-depth="4"] .markmap-foreign { background:var(--nodeGreen) !important; }

    .mm-row{ display:flex; align-items:center; gap:10px; }
    .mm-chev{
      display:inline-flex; align-items:center; justify-content:center;
      width:18px; height:18px; border-radius:6px; background:rgba(255,255,255,.10);
      color:rgba(255,255,255,.80); font-size:13px; font-weight:900; margin-left:2px;
    }

    .markmap-node circle{ opacity:0.0 !important; }
  </style>
</head>

<body>
  <div id="header">
    <div id="title">Taxonomy: Animals, Food, and Catering</div>
    <div id="subtitle">Click nodes to expand or magnify</div>
  </div>

  <div id="toolbar">
    <button class="tb-btn" id="plus" title="Zoom In">+</button>
    <button class="tb-btn" id="minus" title="Zoom Out">−</button>
    <button class="tb-btn text" id="resize" title="Back to original view">Resize</button>
    <button class="tb-btn text" id="close">Close</button>
  </div>

  <svg id="svg" class="markmap"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>

  <script>
    (function(){
      const { Transformer, Markmap } = window.markmap;
      const svg = document.getElementById('svg');
      const transformer = new Transformer();
      let mm = null;

      function decorateNodes(){
        if (!mm || !mm.g) return;
        mm.g.selectAll('g.markmap-node').attr('data-depth', d => d.depth);
        mm.g.selectAll('g.markmap-node').each(function(d){
          const g = d3.select(this);
          const div = g.select('foreignObject > div');
          if (div.empty() || div.select('.mm-row').size()) return;
          const text = div.text();
          div.html('');
          const row = div.append('div').attr('class','mm-row');
          row.append('span').attr('class','mm-text').text(text);
          if (d.children && d.children.length) row.append('span').attr('class','mm-chev').text('>');
        });

        mm.g.selectAll('g.markmap-node').on('click.vat', async (event, d) => {
          event.preventDefault(); event.stopPropagation();
          if (d && d.children && d.children.length) await mm.toggleNode(d);
          mm.fit();
          await mm.centerNode(d, { top: 110, right: 110, bottom: 110, left: 110 });
        });
      }

      window.addEventListener('message', (ev)=>{
        if (!ev || !ev.data || ev.data.type !== 'VAT_SET') return;
        const out = transformer.transform(String(ev.data.markdown || ''));
        if (!mm) {
          mm = Markmap.create(svg, {
            autoFit: true,
            initialExpandLevel: 2,
            /* Tighter geometry for "Neatly Packaged" look */
            spacingVertical: 45,
            spacingHorizontal: 110,
            paddingX: 16
          }, out.root);
        } else {
          mm.setData(out.root);
        }
        decorateNodes();
      });

      /* FIXED ZOOM LOGIC: Now zooms instead of re-rendering levels */
      document.getElementById('plus').onclick = (e) => { e.stopPropagation(); mm.rescale(1.2); };
      document.getElementById('minus').onclick = (e) => { e.stopPropagation(); mm.rescale(0.8); };
      document.getElementById('resize').onclick = (e) => { e.stopPropagation(); mm.fit(); };
      document.getElementById('close').onclick = (e) => { 
        window.parent.postMessage({ type:'VAT_CLOSE' }, '*'); 
      };

      window.parent.postMessage({ type:'VAT_READY' }, '*');
    })();
  </script>
</body>
</html>
